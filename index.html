<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小镇">
<meta name="theme-color" content="#f6f1e7">
<title>小镇</title>
<script>
  // Service Worker：注册 + 有新版本时自动接管刷新一次（只刷一次，防循环）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        reg.update().catch(function(){});
        setInterval(function(){ reg.update().catch(function(){}); }, 3600 * 1000);
      }).catch(function(){});
    });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('CHECK');
      }
    });
  }
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#efe8da;color:#2b2620;
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{max-width:520px;margin:0 auto;background:#f6f1e7;min-height:100vh;position:relative;padding-bottom:calc(66px + env(safe-area-inset-bottom))}

/* ---------- 顶部 ---------- */
#hdr{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
#hdr .d{font-size:13px;color:#9a8f7d;letter-spacing:.5px}
#hdr .v{font-size:11px;color:#b8ae9c}
.resbar{display:flex;gap:6px;padding:0 16px 6px;overflow-x:auto;scrollbar-width:none}
.resbar::-webkit-scrollbar{display:none}
.res{display:flex;align-items:center;gap:4px;background:#fffdf8;border:1px solid #e6ddcc;border-radius:9px;padding:3px 9px 3px 7px;font-size:13px;color:#4a4136;white-space:nowrap;flex:0 0 auto;transition:.25s}
.res b{font-weight:600;font-variant-numeric:tabular-nums}
.res.up{background:#eef4e6;border-color:#c6d8b4}
.res.down{background:#f8ece6;border-color:#e0c3b6}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.res i{font-style:normal;font-size:11px;color:#a39887}

/* ---------- 小镇 ---------- */
#town{position:relative;margin:2px 10px 0;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(90,70,40,.08);aspect-ratio:1.8}
#town svg{display:block;width:100%;height:auto}
#town #scene,#town #folks{position:absolute;left:0;top:0;width:100%;height:100%;height:100%}
#town #folks{pointer-events:none}
#town .cap{position:absolute;left:10px;top:8px;font-size:11px;color:#5a5040;letter-spacing:1px;
  background:rgba(255,252,244,.8);padding:2px 8px;border-radius:9px;box-shadow:0 1px 3px rgba(90,70,40,.12)}
#town .pop{position:absolute;right:10px;top:8px;font-size:11px;color:#5a5040;
  background:rgba(255,252,244,.8);padding:2px 8px;border-radius:9px;box-shadow:0 1px 3px rgba(90,70,40,.12)}

/* ---------- 页面 ---------- */
main{padding:14px 16px 20px}
.sec-t{font-size:12px;color:#9a8f7d;letter-spacing:1.5px;margin:18px 0 9px;display:flex;justify-content:space-between;align-items:center}
.sec-t span{letter-spacing:0}

.tasks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.task{
  background:#fffdf8;border:1px solid #e6ddcc;border-radius:13px;
  padding:11px 12px;text-align:left;cursor:pointer;position:relative;
  transition:transform .12s ease,background .2s,border-color .2s;
  -webkit-user-select:none;user-select:none;
}
.task:active{transform:scale(.97)}
.task.on{background:#f2f7ea;border-color:#b9cfa4}
.task .n{font-size:15px;font-weight:600;color:#2b2620;display:flex;align-items:center;gap:6px}
.task .p{font-size:12px;color:#8a8070;margin-top:3px}
.task .who{font-size:11px;color:#a39887;margin-top:5px;letter-spacing:.2px}
.task.on .who{color:#5c7a4a}
.task .chk{position:absolute;top:10px;right:11px;width:16px;height:16px;border-radius:50%;border:1.5px solid #ddd2be;transition:.2s}
.task.on .chk{background:#5c7a4a;border-color:#5c7a4a}
.task.on .chk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.task.lock{opacity:.5}
.task.lock .who{color:#b0a694}

.btn{
  display:block;width:100%;padding:14px;border-radius:13px;border:none;
  background:#3d3428;color:#f8f4ea;font-size:15.5px;font-weight:600;letter-spacing:1px;
  cursor:pointer;transition:transform .12s;font-family:inherit;
}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#d8cfbe;color:#a2988a}
.btn.ghost{background:#fffdf8;color:#5a5044;border:1px solid #e0d7c6;font-weight:500}
.btn .sub{display:block;font-size:11.5px;font-weight:400;opacity:.7;margin-top:2px;letter-spacing:.3px}

/* 建筑 */
.bcard{background:#fffdf8;border:1px solid #e6ddcc;border-radius:13px;padding:12px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:center}
.bcard .ic{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#f2ece0;display:flex;align-items:center;justify-content:center}
.bcard .bd{flex:1;min-width:0}
.bcard .bn{font-size:14.5px;font-weight:600}
.bcard .bx{font-size:12px;color:#8a8070;margin-top:2px;line-height:1.42}
.bcard .bc{font-size:11.5px;color:#9a8f7d;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.bcard .bc s{color:#c0b5a2;text-decoration:line-through}
.bcard .bb{flex:0 0 auto;border:none;background:#3d3428;color:#f8f4ea;font-size:12.5px;padding:8px 13px;border-radius:9px;font-weight:600;font-family:inherit;cursor:pointer}
.bcard .bb:disabled{background:#e6ddcc;color:#b0a694}
.bcard .bb.built{background:#eef4e6;color:#5c7a4a}
.lv{font-size:10.5px;background:#f0e9db;color:#8a7f6c;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.aiform label{display:block;font-size:12px;color:#7a705e;margin:10px 0 4px}
.aiform input{width:100%;box-sizing:border-box;border:1px solid #d8cdb8;border-radius:8px;
  padding:8px 10px;font-size:13px;background:#fffdf6;color:#4a4235;font-family:inherit}
.bcard.up{background:#fffef9;border-color:#e9dfc6;box-shadow:inset 3px 0 0 #dcc99c}
.bcard.up .lv{background:#eee7d2;color:#7a6a48;font-weight:600}
.bcard.up .bb{background:#5c7a4a}

/* 人 */
.prow{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid #eee5d6}
.prow:last-child{border-bottom:none}
.pav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex:0 0 34px}
.pn{font-size:14px;font-weight:600}
.pd{font-size:11.5px;color:#8a8070;margin-top:1px}
.pq{font-size:11.5px;color:#a39887;margin-left:auto;text-align:right;flex:0 0 auto}
/* 镇子等级 */
.rk{margin-bottom:14px}
.rk-t{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#8a8070;margin-bottom:5px}
.rk-t b{color:#3d3428;font-size:14.5px;letter-spacing:2px;font-weight:700}
.rk-b{height:5px;border-radius:3px;background:#e6ddcc;overflow:hidden}
.rk-b i{display:block;height:100%;background:linear-gradient(90deg,#a89372,#7a6a4a);border-radius:3px;transition:width .6s cubic-bezier(.22,.9,.3,1)}
.empty{text-align:center;padding:34px 20px;color:#9a8f7d;font-size:13.5px;line-height:1.9}

/* 日志 */
.logrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0e8da;font-size:13px}
.logrow .ld{color:#b0a694;font-size:11.5px;flex:0 0 42px;padding-top:2px;font-variant-numeric:tabular-nums}
.logrow .lt{color:#4a4136;flex:1}

/* ---------- 底栏 ---------- */
#tabs{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:100%;max-width:520px;
  display:flex;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);
  border-top:1px solid #e6ddcc;
  padding-bottom:env(safe-area-inset-bottom);z-index:40;
}
#tabs button{
  flex:1;border:none;background:none;padding:9px 0 8px;font-size:11px;color:#a39887;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
#tabs button svg{width:21px;height:21px;stroke:#a39887;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#3d3428}
#tabs button.on svg{stroke:#3d3428}

/* ---------- 弹层 ---------- */
#modal{position:fixed;inset:0;z-index:90;display:none}
#modal.show{display:block}
#modal .mask{position:absolute;inset:0;background:rgba(40,32,22,.42);backdrop-filter:blur(2px)}
#modal .sheet{
  position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;
  background:#f6f1e7;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:up .28s cubic-bezier(.22,.9,.3,1);
}
@keyframes up{from{transform:translate(-50%,40px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:700}
.sheet .sub{font-size:12.5px;color:#9a8f7d;margin-bottom:16px;letter-spacing:.5px}
.sheet p{margin:0 0 12px;font-size:14px;color:#4a4136;line-height:1.72}

.opt{
  display:block;width:100%;text-align:left;background:#fffdf8;border:1px solid #e6ddcc;
  border-radius:12px;padding:12px 14px;margin-bottom:9px;font-family:inherit;cursor:pointer;
  transition:transform .1s;
}
.opt:active{transform:scale(.985)}
.opt:disabled{opacity:.42}
.opt .lb{display:block;font-size:14.5px;font-weight:600;color:#2b2620}
.opt .cost{display:block;font-size:11.5px;color:#9a8f7d;margin-top:3px}
.opt .cost b{color:#5c7a4a;font-weight:600}
.opt .cost em{font-style:normal;color:#a8543c}

.tally{border-top:1px solid #e6ddcc;margin-top:6px;padding-top:12px}
.tally .ti{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:#4a4136}
.tally .ti .k{color:#8a8070}
.tally .ti .v{font-variant-numeric:tabular-nums;font-weight:600}
.tally .ti.neg .v{color:#a8543c}
.tally .ti.pos .v{color:#5c7a4a}
.tally .hd{font-size:11.5px;color:#a39887;letter-spacing:1px;margin:10px 0 2px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:rgba(45,37,27,.92);color:#f8f4ea;font-size:13px;padding:9px 16px;border-radius:20px;
  z-index:120;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center;
}
.toast.show{opacity:1}

/* SVG 动效 */
.smoke{animation:smoke 4.5s ease-in-out infinite}
@keyframes smoke{0%{opacity:.28;transform:translateY(0)}50%{opacity:.5;transform:translateY(-5px)}100%{opacity:.28;transform:translateY(0)}}
.flick{animation:flick 3.2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.82}70%{opacity:.94}}

/* 建筑微动效：每个部件单独转，不是整栋转 */
.spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 7.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.flag{animation:flag 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes flag{0%,100%{transform:scaleX(1) skewY(0deg)}50%{transform:scaleX(.78) skewY(-4deg)}}
.spark{animation:spark 2.1s ease-out infinite}
@keyframes spark{0%{opacity:0;transform:translateY(0)}18%{opacity:.95}100%{opacity:0;transform:translateY(-14px)}}
.ripple{animation:ripple 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%,100%{transform:scaleX(1);opacity:.3}50%{transform:scaleX(1.25);opacity:.55}}
.glow{animation:glow 3.1s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}

/* 人物：位置由 JS 每帧写 transform，动作由 CSS 演 */
.folk .body{display:block}
.folk.walking .body{animation:bob .44s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.35px)}}
.folk.working .body{animation:work 2.4s ease-in-out infinite}
@keyframes work{0%,100%{transform:translateY(0)}30%{transform:translateY(1.2px)}55%{transform:translateY(0)}}
.folk.idle .body{animation:idleb .44s ease-in-out infinite}
@keyframes idleb{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}
/* 斗笠自己晃：绕帽檐中心摇一度半。整块一起上下浮动会像被提着走，
   只有帽子在晃，才像戴着它的活人 */
.folk .hat{transform-box:fill-box;transform-origin:50% 88%;animation:hatsway 4.6s ease-in-out infinite}
@keyframes hatsway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
.folk.walking .hat{animation-duration:1.05s}
.folk.working .hat{animation-duration:2.6s}

/* 飘字：打卡派工、过夜收成。米白药丸 + 深字，压在房子上也不糊 */
.float{
  position:absolute;transform:translate(-50%,0);
  font-size:12.5px;font-weight:700;color:#3a3020;letter-spacing:.3px;
  background:rgba(255,250,238,.95);border:1px solid rgba(140,120,90,.3);
  padding:2px 8px;border-radius:10px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(80,60,30,.18);pointer-events:none;z-index:6;
  animation:floataway 1.75s ease-out forwards;
}
@keyframes floataway{
  0%{opacity:0;transform:translate(-50%,8px) scale(.94)}
  10%{opacity:1;transform:translate(-50%,0) scale(1)}
  70%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-24px) scale(1)}
}
</style>
</head>

/* ---------- 事件机制：掷骰 / 冷却抽取 / 村长家 ---------- */

let state = null;

// 成功率 = 基础值 + 已投入的加成，封顶 95% —— 纸墨世界没有百分之百
function chanceOf(o){
  let p = o.chance;
  const b = o.bonus;
  if (b){
    if (b.res) p += Math.floor((state.res[b.res] || 0) / (b.per || 5)) * (b.step || 0.05);
    if (b.who && state.pop.some(pp => pp.id === b.who)) p += (b.plus || 0.10);
  }
  return Math.min(0.95, Math.max(0.05, p));
}
// 白话把握，不显示数字 —— 古人不谈百分比
function chanceWord(p){
  if (p >= 0.9) return '十拿九稳';
  if (p >= 0.75) return '稳当';
  if (p >= 0.6) return '有七成把握';
  if (p >= 0.45) return '对半开';
  if (p >= 0.3) return '赌一把';
  return '听天由命';
}
// 村长只摆平"不涉人命/走人/赌局"的小事。大事必须到你面前
function isMinor(evt){
  return !evt.opts.some(o => o.warn || o.chance || (o.bad && o.bad.pop));
}
// 冷却抽取：最近 4 个不再出现；平淡事权重压低，危机优先
function pickEvent(){
  const maxTier = popCount() >= 6 ? 3 : popCount() >= 3 ? 2 : 1;
  if (!state.seen) state.seen = [];
  if (!state.grudges) state.grudges = {};
  const pool = EVENTS.filter(e =>
    e.tier <= maxTier &&
    state.seen.indexOf(e.id) < 0 &&
    (!e.when || e.when()) &&
    // 记仇协议：只有镇子真的记了这笔账，寻仇的人才会来；来过一回，账就销了
    (!e.grudgeOn || state.grudges[e.grudgeOn]));
  if (!pool.length) return null;
  let total = 0;
  for (const e of pool) total += (e.w || 1) * (e.grudgeOn ? 3 : 1);   // 记仇的事来得急、来得准
  let r = rnd() * total;
  let pick = pool[pool.length - 1];
  for (const e of pool){
    r -= (e.w || 1) * (e.grudgeOn ? 3 : 1);
    if (r <= 0){ pick = e; break; }
  }
  if (pick.grudgeOn) delete state.grudges[pick.grudgeOn];
  state.seen.push(pick.id);
  while (state.seen.length > 4) state.seen.shift();
  return pick;
}
let tab = 'today';

// 建筑等级。没升过就是 1；数字型建筑（木棚/石屋/陷阱）不升级，靠数量长。
function lvOf(id){ return (state.lv && state.lv[id]) || 1; }
function lvAdd(id){ return Math.min(2, lvOf(id) - 1); }   // Lv1→0, Lv2→1, Lv3→2

function cap(){
  return 3 + (state.build.hut || 0) * 3 + (state.build.stonehouse || 0) * 5;
}
function rank(){
  const n = popCount();
  if (n >= 16) return { t:'重镇', c:'#b8863a' };
  if (n >= 10) return { t:'山城', c:'#8a7a58' };
  if (n >= 6)  return { t:'集镇', c:'#6f7a5e' };
  if (n >= 3)  return { t:'小村', c:'#7a8a6a' };
  if (n >= 1)  return { t:'荒村', c:'#9a8f7d' };
  return { t:'空地', c:'#b0a694' };
}
function dwellers(){
  const spare = Math.max(0, cap() - state.pop.length);
  return Math.min(spare, (state.build.hut || 0) * 2 + (state.build.stonehouse || 0) * 3);
}
function popCount(){
  return state.pop.length + dwellers();
}
function perDay(){
  let k = 1;
  if (state.build.granary) k = [0.60, 0.50, 0.42][lvAdd('granary')];
  return Math.ceil(popCount() * 0.5 * k);
}
function has(prof){
  if (prof === 'safe') return state.pop.some(p => p.id === 'sleep');
  return state.pop.some(p => p.id === prof);
}
function room(){ return popCount() < cap(); }

const STEPS = [[0,'破屋'],[1,'荒村'],[3,'小村'],[6,'集镇'],[10,'山城'],[16,'重镇']];
function rankBar(){
  const n = popCount();
  let cur = 0, next = null;
  for (let i = 0; i < STEPS.length; i++){
    if (n >= STEPS[i][0]) cur = i;
    else { next = STEPS[i]; break; }
  }
  const lo = STEPS[cur][0];
  const hi = next ? next[0] : lo + 1;
  const pct = next ? Math.min(100, Math.round((n - lo) / (hi - lo) * 100)) : 100;
  const label = next
    ? '再招 ' + (hi - n) + ' 人，镇子升为「' + next[1] + '」'
    : '这里已经是这一带最热闹的地方了';
  return '<div class="rk"><div class="rk-t"><b>' + STEPS[cur][1] + '</b><span>' + label + '</span></div>' +
    '<div class="rk-b"><i style="width:' + pct + '%"></i></div></div>';
}

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// 两个 YYYY-MM-DD 之间隔了几天（同一天 = 0）
function daysBetween(a, b){
  const t = s => { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
  return Math.max(0, Math.round((t(b) - t(a)) / 86400000));
}

// 自治系数：你不在的夜里，镇子自己能管多少。
// 官府是挂机引擎 —— 城主府在时挂机产 75%，不在时 30%，盖它等于雇了个替班管家
function autonomy(){
  const l = state.build.hall ? lvOf('hall') : 0;
  return [0.30, 0.45, 0.60, 0.75][l];
}

function fresh(){
  return {
    v: 4, ver: APP_VER,
    day: 1,
    lastNight: '',
    checks: {},
    res: { wood: 0, stone: 0, meat: 5, cloth: 0, iron: 0, coin: 0 },
    pop: [],
    build: { hut:0, stonehouse:0, trap:0, granary:0, well:0, forge:0, market:0, tower:0, shrine:0 },
    lv: {},
    grudges: {},
    safe: 0, happy: 0,
    log: [],
    pend: null,
    came: [],
    legacy: null
  };
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE);
    if (raw){
      const s = JSON.parse(raw);
      if (s && s.v === 4){
        // 老存档没有等级字段，全部当 Lv1 —— 不能因为升级上线就把人家的房子降级
        if (!s.lv) s.lv = {};
        if (!s.seen) s.seen = [];   // 事件冷却
        if (!s.hist) s.hist = {};   // 做过的选择（记仇与事件链从这读）
        state = s;
        return;
      }
    }
    // 旧档：转成一条前人记录
    let old = null;
    for (const k of OLD_KEYS){
      try{ const r = localStorage.getItem(k); if (r){ old = JSON.parse(r); break; } }catch(e){}
    }
    state = fresh();
    if (old){
      const bits = [];
      if (old.days){
        const n = Object.keys(old.days).length;
        bits.push('他在这里待了 ' + n + ' 天');
      }
      if (old.checks){
        const n = Object.keys(old.checks).length;
        bits.push('做过 ' + n + ' 件事');
      }
      if (old.points) bits.push('攒下 ' + old.points + ' 分');
      if (old.log && old.log.length) bits.push('留下了 ' + old.log.length + ' 条痕迹');
      state.legacy = bits.length ? bits.join('，') : null;
    }
  }catch(e){ state = fresh(); }
}

function save(){
  try{ localStorage.setItem(SAVE, JSON.stringify(state)); }catch(e){}
}

/* ---------- 小镇绘制 ---------- */

function skyColors(){
  const h = new Date().getHours();
  if (h >= 6 && h < 17) return { a:'#cfe3ee', b:'#eef3e6', ground:'#e6dfcb', g2:'#d6cdb2', night:false };
  if (h >= 17 && h < 20) return { a:'#f0c69a', b:'#f6e3c8', ground:'#dfd4ba', g2:'#cdbf9f', night:false };
  return { a:'#2b3350', b:'#41496a', ground:'#3b3a44', g2:'#2f2e37', night:true };
}

function useIcon(name, cx, by, size, color, op){
  const x = cx - size / 2, y = by - size;
  return '<use href="#ic-' + name + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
    '" width="' + size.toFixed(1) + '" height="' + size.toFixed(1) + '"' +
    (color ? ' style="color:' + color + '"' : '') +
    (op === undefined ? '' : ' opacity="' + op + '"') + '/>';

/* 建筑上会动的那个部件。动的是部件，不是整栋房子 —— 房子晃起来像地震 */
function attach(b, cx, by, sz, n){
  const ink = n ? '#e2cfa6' : '#6b5334';
  const warm = n ? '#f0cf85' : '#c9a86a';
  let s = '';
  if (b.icon === 'granary'){
    // 风车叶：全屏唯一匀速运动，眼睛会先扫到它
    const cy = by - sz * 0.8, r = sz * 0.23;
    let leaf = '';
    for (let k = 0; k < 4; k++){
      const a = k * Math.PI / 2;
      const ex = Math.cos(a) * r, ey = Math.sin(a) * r;
      const nx = -Math.sin(a) * r * 0.2, ny = Math.cos(a) * r * 0.2;
      leaf += '<path d="M0 0 L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' L' +
        (ex + nx).toFixed(1) + ' ' + (ey + ny).toFixed(1) + ' Z" fill="' + ink + '" opacity=".5"/>';
    }
    s += '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')"><g class="spin">' + leaf + '</g></g>';
  }
  if (b.icon === 'forge'){
    // 火星：三个点错峰上升，铁在被打
    const fy = by - sz * 0.42;
    for (let k = 0; k < 3; k++){
      s += '<circle class="spark" style="animation-delay:' + (k * 0.72).toFixed(2) + 's" cx="' +

        '" r="' + (0.75 + k * 0.16).toFixed(2) + '" fill="#f2b45c"/>';
    }
  }
  if (b.icon === 'market'){
    // 旗：逢五开市，旗平时也挂着

    s += '<path d="M' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ' v-' + (sz * 0.2).toFixed(1) +
      '" stroke="' + ink + '" stroke-width="1.1" opacity=".6"/>';
    s += '<path class="flag" d="M' + tx.toFixed(1) + ' ' + (ty - sz * 0.2).toFixed(1) +
      ' l' + (sz * 0.15).toFixed(1) + ' ' + (sz * 0.05).toFixed(1) +
      ' l-' + (sz * 0.15).toFixed(1) + ' ' + (sz * 0.05).toFixed(1) + ' Z" fill="' + warm + '" opacity=".72"/>';
  }
  if (b.icon === 'well'){
    s += '<ellipse class="ripple" cx="' + cx.toFixed(1) + '" cy="' + (by - sz * 0.12).toFixed(1) +
      '" rx="' + (sz * 0.15).toFixed(1) + '" ry="2" fill="' + (n ? '#9fb4c4' : '#a8c0cc') + '"/>';
  }
  if (b.icon === 'tower'){
    // 顶灯：夜里才亮得明显
    s += '<circle class="glow" cx="' + cx.toFixed(1) + '" cy="' + (by - sz * 0.82).toFixed(1) +
      '" r="' + (sz * 0.09).toFixed(1) + '" fill="' + warm + '" opacity=".7"/>';
  }
  if (b.icon === 'shrine'){
    s += '<path class="smoke" style="animation-delay:1.1s" d="M' + (cx - sz * 0.16).toFixed(1) + ' ' +
      (by - sz * 0.5).toFixed(1) + ' q3 -7 0 -12" stroke="' + (n ? '#c9bfa8' : '#a89e8c') +
      '" stroke-width="1.2" fill="none" opacity=".34"/>';
  }
  return s;
}

/* 台基：等级越高，房子站得越高。这是全画面统一的"这栋跟那栋不一样"信号 —— 
   配件要凑近才看得清，台基一眼就能扫出来 */
function baseTier(icon, cx, by, sz, n){
  const k = lvAdd(icon);
  if (!k) return '';
  const stone = n ? '#a89d84' : '#9c8f74';
  const hi = n ? '#cfc4a8' : '#b8ab8c';
  const w0 = sz * 0.9;
  let s = '';
  // 一级台一块砖，两块砖就是两级台阶 —— 数台阶就知道这栋升到几级
  for (let i = 0; i < k; i++){
    const w = w0 * (1 - i * 0.16);
    const y = by - (k - i) * 2.6;
    s += '<rect x="' + (cx - w / 2).toFixed(1) + '" y="' + y.toFixed(1) +
         '" width="' + w.toFixed(1) + '" height="2.6" fill="' + stone + '" opacity=".62" rx=".7"/>';
    s += '<path d="M' + (cx - w / 2 + 1).toFixed(1) + ' ' + (y + 0.7).toFixed(1) +
         ' h' + (w - 2).toFixed(1) + '" stroke="' + hi + '" stroke-width=".7" opacity=".55"/>';
  }
  return s;
}

/* 升级后的第二件东西。等级差异不重画房子 —— 房子放大一点，旁边多长出一样东西，

    s += '<path class="smoke" style="animation-delay:.9s" d="M' + (cx + sz * 0.27).toFixed(1) + ' ' +
         (by - sz * 0.9).toFixed(1) + ' q4 -9 0 -15" stroke="' + (n ? '#c9bfa8' : '#a89e8c') +
         '" stroke-width="1.5" fill="none" opacity=".34"/>';
    if (k) s += '<path d="M' + (cx - sz * 0.42).toFixed(1) + ' ' + (by - sz * 0.5).toFixed(1) +
         ' L' + (cx + sz * 0.36).toFixed(1) + ' ' + (by - sz * 0.66).toFixed(1) +
         '" stroke="' + ink + '" stroke-width="2.2" opacity=".5" stroke-linecap="round"/>';
  }

  if (icon === 'market'){
    // 集市：Lv2 多一个侧摊，Lv3 挂两盏灯
    s += '<rect x="' + (cx + sz * 0.3).toFixed(1) + '" y="' + (by - sz * 0.3).toFixed(1) +
         '" width="' + (sz * 0.26).toFixed(1) + '" height="' + (sz * 0.3).toFixed(1) + '" fill="' + warm + '" opacity=".42"/>';

      s += '<circle class="glow" style="animation-delay:1.4s" cx="' + (cx + sz * 0.38).toFixed(1) + '" cy="' + (by - sz * 0.4).toFixed(1) + '" r="2.6" fill="' + warm + '" opacity=".8"/>';

      s += '<path class="flag" d="M' + (cx + sz * 0.06).toFixed(1) + ' ' + (by - sz * 1.28).toFixed(1) +

    }
    if (k) s += '<path d="M' + (cx - sz * 0.34).toFixed(1) + ' ' + (by - sz * 0.62).toFixed(1) +
         ' q' + (sz * 0.34).toFixed(1) + ' -' + (sz * 0.18).toFixed(1) + ' ' + (sz * 0.68).toFixed(1) + ' 0' +

/* 建筑清单：前排住人，后排干活 */
function buildingSlots(){
  const B = state.build || {};
  const front = [], back = [];
  const homes = [];
  for (let i = 0; i < (B.hut || 0); i++)   homes.push({ icon:'hut',   smoke: i === 0 });
  for (let i = 0; i < (B.stonehouse || 0); i++) homes.push({ icon:'house', smoke: true });
  if (B.forge)  front.push({ icon:'forge',  smoke: true });
  if (B.market) front.push({ icon:'market', smoke: false });
  if (B.well)    back.push({ icon:'well' });
  if (B.granary) back.push({ icon:'granary' });
  if (B.tower)   back.push({ icon:'tower' });
  if (B.shrine)  back.push({ icon:'shrine' });
  front.push.apply(front, homes);
  // 前排最多 5 栋，多出来的房子落到后排 —— 两排才看得出镇子变厚
  while (front.length > 5) back.unshift(front.pop());
  return { front, back };
}

/* 一排里均匀分布：1 个居中，多了自动散开 —— 这个"散开"本身就是成长 */
function rowPos(i, n, sizeMax){
  const shrink = n <= 2 ? 1 : n <= 4 ? 0.74 : n <= 6 ? 0.6 : 0.51;
  const size = sizeMax * shrink;
  if (n <= 1) return { x: 180, size: size };
  const pad = Math.max(size * 0.56, 12);
  const span = 360 - pad * 2;
  return { x: pad + i * (span / (n - 1)), size: size };
}

/* 场景层：天空 / 山 / 建筑 / 火堆。人不在这一层 —— 见 folkLayer() */
function sceneBody(){
  const c = skyColors();
  const n = c.night;

       '<linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">' +
       '<stop offset="0" stop-color="' + c.ground + '"/><stop offset="1" stop-color="' + c.g2 + '"/></linearGradient></defs>';

  if (n){

    }
    s += '<circle cx="310" cy="26" r="8.5" fill="#f4e9c8" opacity=".95"/><circle cx="314" cy="23" r="8" fill="' + c.a + '"/>';
  } else {
    s += '<circle cx="306" cy="28" r="11" fill="#f7e6b8" opacity=".7"/>';
  }

  s += '<path d="M0 58 L44 30 L82 50 L124 24 L166 48 L208 28 L252 50 L296 26 L338 46 L360 36 L360 88 L0 88 Z" fill="' + (n ? '#3a3f57' : '#bcc9b6') + '" opacity=".8"/>';
  s += '<path d="M0 70 L56 50 L108 66 L164 44 L220 64 L282 46 L360 66 L360 90 L0 90 Z" fill="' + (n ? '#33384c' : '#aaba9f') + '" opacity=".92"/>';
  s += '<rect x="0" y="78" width="360" height="122" fill="url(#grd)"/>';

  // 远景屋顶：人多了，镇子往山脚铺开
  if (people >= 9){
    const far = n ? '#4b4f60' : '#c3b79c';
    for (let i = 0; i < 11; i++){
      const bx = 4 + i * 32 + (i % 3) * 6, by = 100 - (i * 5 % 9);
      s += '<rect x="' + (bx + 2) + '" y="' + by + '" width="11" height="6" fill="' + far + '" opacity=".34"/>';
      s += '<path d="M' + bx + ' ' + by + ' l7.5 -5.5 l7.5 5.5 Z" fill="' + far + '" opacity=".42"/>';
    }
  }
  if (people >= 16){
    const far2 = n ? '#414655' : '#cdc2aa';
    for (let i = 0; i < 14; i++){
      const bx = 2 + i * 25 + (i % 4) * 5, by = 88 - (i * 7 % 11);
      s += '<rect x="' + (bx + 1.5) + '" y="' + by + '" width="9" height="5" fill="' + far2 + '" opacity=".26"/>';
      s += '<path d="M' + bx + ' ' + by + ' l6 -4.5 l6 4.5 Z" fill="' + far2 + '" opacity=".32"/>';
    }
  }

  // 路：建筑多了才有
  if (front.length + back.length >= 4){
    s += '<path d="M-10 196 Q100 188 190 192 T370 186" stroke="' + (n ? '#4c4a57' : '#c6bb9e') + '" stroke-width="10" fill="none" opacity=".5"/>';
    s += '<path d="M-10 196 Q100 188 190 192 T370 186" stroke="' + (n ? '#585664' : '#d3c9ad') + '" stroke-width="3.5" fill="none" opacity=".5" stroke-dasharray="3 6"/>';
  }

  // 后排：干活的地方，画得高一点、淡一点
  back.forEach((b, i) => {
    const p = rowPos(i, back.length, 56);
    const sz = p.size * (1 + lvAdd(b.icon) * 0.13);
    s += '<ellipse cx="' + p.x + '" cy="152" rx="' + (sz * 0.4) + '" ry="2.2" fill="' + (n ? '#2b2a32' : '#bfb39a') + '" opacity=".26"/>';
    s += baseTier(b.icon, p.x, 150, sz, n);
    s += useIcon(b.icon, p.x, 150, sz, bldgBack, 0.8);
    s += upgradeBits(b.icon, p.x, 150, sz, n);
    s += attach(b, p.x, 150, sz, n);
  });

  // 起点：那间破屋（一栋房都没盖时）
  if (!front.length){
    s += '<ellipse cx="180" cy="195" rx="30" ry="3.2" fill="' + (n ? '#24232b' : '#bfb39a') + '" opacity=".3"/>';
    s += useIcon('ruin', 180, 195, 72, bldg, 0.96);
    s += '<path d="M194 140 l6 -10" stroke="' + (n ? '#3b372f' : '#a99a7d') + '" stroke-width="1.4" fill="none"/>';
  }

  // 前排
  front.forEach((b, i) => {
    const p = rowPos(i, front.length, 78);
    const sz = p.size * (1 + lvAdd(b.icon) * 0.13);
    s += '<ellipse cx="' + p.x + '" cy="194" rx="' + (sz * 0.4) + '" ry="2.4" fill="' + (n ? '#24232b' : '#bfb39a') + '" opacity=".3"/>';
    s += baseTier(b.icon, p.x, 194, sz, n);
    s += useIcon(b.icon, p.x, 194, sz, bldg, 0.95);
    if (b.smoke){
      // 两缕错峰的烟。一缕像失火，两缕才像有人在做饭
      s += '<path class="smoke" style="animation-delay:' + (i * 0.6).toFixed(2) + 's" d="M' +
           (p.x + sz * 0.3).toFixed(1) + ' ' + (192 - sz * 0.9).toFixed(1) +
           ' q4 -8 0 -14 q-4 -7 1 -12" stroke="#a89e8c" stroke-width="1.6" fill="none" opacity=".4"/>';
      s += '<path class="smoke" style="animation-delay:' + (i * 0.6 + 2.2).toFixed(2) + 's" d="M' +
           (p.x + sz * 0.22).toFixed(1) + ' ' + (192 - sz * 0.84).toFixed(1) +
           ' q-3 -7 0 -12 q3 -6 -1 -10" stroke="#b5ac9a" stroke-width="1.2" fill="none" opacity=".24"/>';
    }
    s += upgradeBits(b.icon, p.x, 194, sz, n);
    s += attach(b, p.x, 194, sz, n);
  });

  // 人不在这一层。他们住在常驻的 #folks 里，这一层重绘也打断不了他们走路。

  // 火堆：三个人以上
  if (people >= 3){
    const fx = 180, fy = 200;
    s += '<circle cx="' + fx + '" cy="' + (fy - 2) + '" r="9" fill="#e8a04a" opacity=".13"/>';
    s += '<path class="flick" d="M' + fx + ' ' + (fy - 1) + ' l-2.6 -4.4 l2 .9 l.6 -4.6 l1.8 4.6 l1.5 -.9 Z" fill="#e8a04a"/>';
  }

  // 灯：有集市之后，夜里会亮
  if (state.build.market && n){
    s += '<circle cx="86" cy="176" r="7" fill="#f0cf85" opacity=".16"/>';
    s += '<g style="color:#d8b878">' + useIcon('lantern', 86, 180, 14, '#d8b878') + '</g>';
  }
  if (state.build.trap){
    for (let i = 0; i < (state.build.trap || 0); i++){
      const tx = 300 + i * 11;
      s += '<path d="M' + tx + ' 197 l5 -4 l5 4" stroke="' + (n ? '#8a8068' : '#8a7a58') + '" stroke-width="1.2" fill="none" opacity=".65"/>';
    }
  }

  return s;
}

/* ==========================================================================
   人物层
   为什么单独一层：场景每次 render 都整块重建，人要是画在场景里，一重绘
   就把走路打断 —— 打卡正好就是重绘的时机，等于刚出门就被拽回原地。
   所以人住在常驻的 #folks 里，位置由 rAF 每帧写 transform。
   ========================================================================== */

const SVG_NS = 'http://www.w3.org/2000/svg';
const FOLK = { nodes:new Map(), pos:new Map(), raf:0, last:0, ink:null };
// 三排街道，间距 14~15px。再密就叠成糖葫芦了 —— 人高才 11px
const ROW_Y = [198.5, 184, 170];

// 七件事分别去哪儿。没有对应建筑的，去村口或山脚的空地。
const WORK_AT = {
  wake:  { at:'left',   label:'上山' },
  train: { at:'right',  label:'下套' },
  wash:  { at:'well',   label:'看诊' },
  study: { at:'back',   label:'采石' },
  quit:  { at:'forge',  label:'打铁' },
  read:  { at:'market', label:'记账' },
  sleep: { at:'tower',  label:'巡夜' }
};

function ensureTownDOM(){
  const t = document.getElementById('town');
  if (!t) return null;
  if (t.dataset.ready) return t;
  t.dataset.ready = '1';
  t.innerHTML =
    '<svg id="scene" viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice"></svg>' +
    '<svg id="folks" viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice"></svg>' +
    '<div class="cap" id="capLabel"></div>' +
    '<div class="pop" id="popLabel"></div>';
  return t;
}

// 站位：人少时一排居中，6 人以上两排，12 人以上三排。
// 人多的直观感来自"摊开的宽度 + 站到后排去"，不是把点缩小堆在一起。
// 左右留 36px 边距，别被人数和等级那两个角标压住。
function slotOf(i, n){
  if (n === 1) return { x: 180, y: ROW_Y[0], s: 0.92 };
  const rows = n <= 5 ? 1 : n <= 11 ? 2 : 3;
  const cols = Math.ceil(n / rows);
  // 队伍宽度只由人数决定（不是由列数），这样"人多 = 站得宽"才是单调的：
  // 5 人缩成一小堆，19 人铺满整条街，中间没有回退
  const width = Math.min(252, 56 + n * 11);
  // 最小间距 34：再挤就从"一小群人"变成"一排士兵"
  const gap = cols > 1 ? Math.max(34, width / (cols - 1)) : 0;
  const stagger = rows > 1 ? Math.min(gap * 0.5, 26) : 0;
  const x0 = 180 - (gap * (cols - 1) + stagger) / 2;
  const r = i % rows, c = Math.floor(i / rows);
  // 排与排错开半个身位。不错开就变成一排竖柱子，像货架不像街
  const sx = r === 1 ? stagger : r === 2 ? stagger * 0.45 : 0;
  const jx = ((i * 37) % 9) - 4;
  const jy = ((i * 53) % 7) * 0.24;
  return {
    x: Math.max(30, Math.min(330, x0 + c * gap + sx + jx)),
    y: ROW_Y[r] - jy,
    s: [1, 0.9, 0.8][r]
  };
}

function folkInk(){ return skyColors().night ? '#f7f2e4' : '#4a4235'; }

function paintFolk(id){
  const st = FOLK.pos.get(id), g = FOLK.nodes.get(id);
  if (!st || !g) return;
  g.setAttribute('transform',
    'translate(' + st.x.toFixed(2) + ' ' + st.y.toFixed(2) + ') scale(' + st.s + ')');
}

function setFolkMode(id, mode){
  const g = FOLK.nodes.get(id);
  if (g) g.setAttribute('class', 'folk ' + (mode === 'walk' ? 'walking' : mode === 'work' ? 'working' : 'idle'));
}

function createFolk(id, idx, n){
  const sl = slotOf(idx, n);
  const col = folkInk();
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'folk idle');
  // 草帽 + 圆身 + 两条腿。三样缺一不可：
  // 只有锥 + 圆 = 蘑菇；加扁帽檐 = 戴帽子的蘑菇；再加腿才读成"人"。
  // 扁帽檐还有第二个作用：纯三角会和房子屋顶撞形，一排小人看着像一排小房子
  g.innerHTML =
    '<ellipse cx="0" cy="1" rx="2.9" ry="0.75" fill="' + col + '" opacity=".17"/>' +
    '<g class="body">' +
      '<path d="M-1.4 -2.4 V0.2 M1.4 -2.4 V0.2" stroke="' + col + '" stroke-width="1.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="0" cy="-5" r="3.1" fill="' + col + '"/>' +
      '<path d="M-2.2 -6.4 Q0 -4.6 2.2 -6.4" stroke="' + col + '" stroke-width=".8" fill="none" opacity=".32" stroke-linecap="round"/>' +
      '<g class="hat"><path d="M0 -12.6 L3.5 -8.7 L-3.5 -8.7 Z" fill="' + col + '"/>' +
      '<ellipse cx="0" cy="-8.7" rx="4.5" ry="1.1" fill="' + col + '"/></g>' +
    '</g>';
  document.getElementById('folks').appendChild(g);
  FOLK.nodes.set(id, g);
  FOLK.pos.set(id, {
    x: sl.x, y: sl.y, s: sl.s, hx: sl.x, hy: sl.y, tx: sl.x, ty: sl.y,
    mode: 'idle', phase: Math.random() * 6.28,
    amp: 2.2 + Math.random() * 2.8, wobble: 0.45 + Math.random() * 0.55,
    speed: 60, arrive: null, backAt: 0
  });
  paintFolk(id);
}

// 画在场上的人是 popCount()，不只是那 7 个有名字的。
// 没名字的那部分人是房子带来的住户 —— 他们不产资源，但必须站在那儿，
// 否则盖了三间木棚，画面还是七个人，"人变多"就白做了。
function folkIds(){
  const ids = state.pop.map(p => p.id);
  const extra = popCount() - ids.length;
  for (let i = 0; i < extra; i++) ids.push('dwell' + i);
  return ids;
}

// 人数变化时增删节点 + 重排站位。正在走/干活的人不动，只更新他家在哪。
function syncFolks(){
  if (!ensureTownDOM()) return;
  const ids = folkIds();
  const col = folkInk();

  // 昼↔夜换色：直接重建一遍，比逐个元素改属性干净
  if (FOLK.ink !== col){
    FOLK.nodes.forEach(g => g.remove());
    FOLK.nodes.clear();
    FOLK.pos.clear();
    FOLK.ink = col;
  }

  FOLK.nodes.forEach((g, id) => {
    if (ids.indexOf(id) < 0){ g.remove(); FOLK.nodes.delete(id); FOLK.pos.delete(id); }
  });

  ids.forEach((id, i) => {
    if (!FOLK.nodes.has(id)){ createFolk(id, i, ids.length); return; }
    const st = FOLK.pos.get(id);
    const sl = slotOf(i, ids.length);
    st.hx = sl.x; st.hy = sl.y; st.s = sl.s;
  });

  renderGhosts();
}

// 今天点了、人还没到：虚影站在镇口，晚上才进来
let _ghostBox = null;

function renderGhosts(){
  const f = document.getElementById('folks');
  if (!f) return;
  if (!_ghostBox){
    _ghostBox = document.createElementNS(SVG_NS, 'g');
    f.appendChild(_ghostBox);
  }
  const coming = TASKS.filter(t => state.checks[t.id] && !state.pop.some(p => p.id === t.id) && (!t.need || state.build[t.need]));
  const cc = skyColors().night ? '#e8e2d2' : '#6b6152';
  let s = '';
  coming.forEach((t, i) => {
    const px = 40 + i * 26, py = 182 + (i % 2) * 5;
    // 和真人同形状的虚线版：帽檐、锥、圆身、腿。形状一致，才一眼认得出"这是个人还没到"
    s += '<g opacity=".55" fill="none" stroke="' + cc + '" stroke-width=".9" stroke-dasharray="1.6 1.6">' +
      '<path d="M' + (px - 1.4) + ' ' + (py - 2.4) + ' V' + (py + 0.2) +
      ' M' + (px + 1.4) + ' ' + (py - 2.4) + ' V' + (py + 0.2) + '" stroke-linecap="round"/>' +
      '<circle cx="' + px + '" cy="' + (py - 5) + '" r="3"/>' +
      '<path d="M' + px + ' ' + (py - 12.9) + ' L' + (px + 3.9) + ' ' + (py - 8.6) +
      ' L' + (px - 3.9) + ' ' + (py - 8.6) + ' Z"/>' +
      '<ellipse cx="' + px + '" cy="' + (py - 8.6) + '" rx="5" ry="1.2"/></g>';
  });
  _ghostBox.innerHTML = s;
}

// 建筑的坐标：派工时要知道往哪走
function spotOf(icon){
  const { front, back } = buildingSlots();
  let i = front.findIndex(b => b.icon === icon);
  if (i >= 0){ const p = rowPos(i, front.length, 78); return { x: p.x, y: 191 }; }
  i = back.findIndex(b => b.icon === icon);
  if (i >= 0){ const p = rowPos(i, back.length, 56); return { x: p.x, y: 145 }; }
  return null;
}

function workSpot(t){
  const w = WORK_AT[t.id];
  // 上山/下套/采石都在坡上，得往上走 —— 只横着挪两下不算"出门干活"
  if (w.at === 'left')  return { x: 8,   y: 146 };
  if (w.at === 'right') return { x: 352, y: 146 };
  if (w.at === 'back')  return { x: 300, y: 154 };
  return spotOf(w.at) || { x: 180, y: 191 };
}

// 飘字：位置按 360×200 的坐标系换成百分比，跟 SVG 对齐
function floatText(x, y, txt, color){
  const t = ensureTownDOM();
  if (!t) return;
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  if (color) el.style.color = color;
  el.style.left = (x / 360 * 100).toFixed(2) + '%';
  el.style.top  = (y / 200 * 100).toFixed(2) + '%';
  t.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

// 打卡 → 派人去干活。注意这里不报数字：资源是过夜才结算的，
// 现在写 +5 就是在骗人。写"谁去哪"才是真的。
function dispatchWorker(t){
  const st = FOLK.pos.get(t.id);
  if (!st) return;   // 人还在路上，镇口的虚影已经说明这件事了，不用再弹提示
  const s = workSpot(t);
  st.tx = s.x; st.ty = s.y; st.mode = 'walk';
  setFolkMode(t.id, 'walk');
  st.arrive = () => floatText(s.x, s.y - 15, t.who + ' · ' + WORK_AT[t.id].label);
}

// 过夜结算完、报表关掉之后放一遍：每个人走到自己干活的地方，冒真实数字
function playHarvest(g){
  let delay = 0;
  for (const t of TASKS){
    if (!g[t.res]) continue;
    const st = FOLK.pos.get(t.id);
    if (!st) continue;
    const n = g[t.res];
    const s = workSpot(t);
    setTimeout(() => {
      if (!FOLK.pos.has(t.id)) return;
      st.tx = s.x; st.ty = s.y; st.mode = 'walk';
      setFolkMode(t.id, 'walk');
      st.arrive = () => floatText(s.x, s.y - 15, '+' + n + ' ' + (t.res === 'safe' ? '治安' : RES[t.res].name),
        t.res === 'safe' ? '#8a9a7a' : RES[t.res].color);
    }, delay);
    delay += 260;
  }
}

function folkTick(ts){
  const dt = FOLK.last ? Math.min(64, ts - FOLK.last) / 1000 : 0.016;
  FOLK.last = ts;

  FOLK.pos.forEach((st, id) => {
    if (st.mode === 'walk'){
      const dx = st.tx - st.x, dy = st.ty - st.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      const step = st.speed * dt;
      if (d <= step || d < 0.35){
        st.x = st.tx; st.y = st.ty;
        st.mode = 'work';
        setFolkMode(id, 'work');
        st.backAt = ts + 2300 + Math.random() * 1000;
        if (st.arrive){ const f = st.arrive; st.arrive = null; f(); }
      } else {
        st.x += dx / d * step;
        st.y += dy / d * step;
      }
    } else if (st.mode === 'work'){
      if (ts >= st.backAt){ st.tx = st.hx; st.ty = st.hy; st.mode = 'walk'; setFolkMode(id, 'walk'); }
    } else {
      st.phase += dt;
      st.x = st.hx + Math.sin(st.phase * st.wobble) * st.amp;
      st.y = st.hy;
    }
    paintFolk(id);
  });

  FOLK.raf = requestAnimationFrame(folkTick);
}

function startFolks(){
  if (FOLK.raf) return;
  FOLK.last = 0;
  FOLK.raf = requestAnimationFrame(folkTick);
}
function stopFolks(){
  if (FOLK.raf) cancelAnimationFrame(FOLK.raf);
  FOLK.raf = 0;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopFolks();
  else if (state && state.pop) startFolks();
});

/* ---------- 渲染 ---------- */

function resBar(){
  const order = ['wood','stone','meat','cloth','iron','coin'];
  const box = document.getElementById('resbar');
  let h = '';
  for (const k of order){
    const r = RES[k];
    const v = state.res[k] || 0;
    const dim = (k === 'iron' && !state.build.forge) || (k === 'coin' && !state.build.market);
    h += '<div class="res"' + (dim ? ' style="opacity:.38"' : '') + '>' +
      '<svg width="13" height="13" viewBox="0 0 13 13" style="color:' + r.color + '">' +
      '<use href="#ic-' + k + '" width="13" height="13"/></svg>' +
      '<b>' + v + '</b><i>' + r.name + '</i></div>';
  }
  h += '<div class="res" style="margin-left:auto;opacity:.7"><b>' + rank().t + '</b></div>';
  box.innerHTML = h;
}

// 场景只在"该变了"的时候重绘。签名没变就不动 —— 打卡时不重绘，
// 建筑上的烟和风车就不会每次都从 0 开始转。
let _sceneSig = '';

function renderScene(){
  if (!ensureTownDOM()) return;
  const { front, back } = buildingSlots();
  const sig = [
    front.map(b => b.icon + lvOf(b.icon)).join('.'),
    back.map(b => b.icon + lvOf(b.icon)).join('.'),
    skyColors().night ? 1 : 0,
    popCount()
  ].join('|');

  document.getElementById('capLabel').textContent = rank().t;
  document.getElementById('popLabel').textContent = popCount() + ' / ' + cap() + ' 人';

  if (sig === _sceneSig) return;
  _sceneSig = sig;
  document.getElementById('scene').innerHTML = sceneBody();
}

function render(){
  document.getElementById('dayLabel').textContent = '第 ' + state.day + ' 天';
  document.getElementById('verLabel').textContent = popCount() + ' / ' + cap() + ' 人 · ' + APP_VER;
  renderScene();
  syncFolks();
  resBar();

  const m = document.getElementById('main');
  if (tab === 'today')      m.innerHTML = viewToday();
  else if (tab === 'build') m.innerHTML = viewBuild();
  else if (tab === 'people')m.innerHTML = viewPeople();
  else                      m.innerHTML = viewLog();

  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
}

function viewToday(){
  const done = TASKS.filter(t => state.checks[t.id]).length;
  let h = '';

  if (state.legacy && state.day === 1){
    h += '<div style="background:#f4ecdc;border-radius:12px;padding:12px 14px;font-size:13px;color:#7a6c56;line-height:1.7;margin-bottom:14px">' +
      '上一本册子留在这里：' + state.legacy + '。<br>册子后面是空的。' +
      '<div style="color:#a39887;font-size:12px;margin-top:5px">这里从头开始。</div></div>';
  }

  h += rankBar();
  h += '<div class="sec-t">今天做的事 <span>' + done + ' / 7</span></div>';
  h += '<div class="tasks">';
  for (const t of TASKS){
    const needB = t.need && !state.build[t.need];
    const on = !!state.checks[t.id];
    const lockTxt = needB ? (t.need === 'forge' ? '需铁匠铺' : '需集市') : '';
    h += '<div class="task' + (on ? ' on' : '') + (needB ? ' lock' : '') + '" data-task="' + t.id + '">' +
      '<div class="chk"></div>' +
      '<div class="n">' + t.name + '</div>' +
      '<div class="p">' + t.prof + ' · ' + (t.res === 'safe' ? '治安' : RES[t.res].name + ' +' + yieldOf(t)) + '</div>' +
      '<div class="who">' + (needB ? lockTxt : (on ? t.who + ' 今夜会来' : t.who)) + '</div>' +
      '</div>';
  }
  h += '</div>';

  // 容量提示
  const free = cap() - popCount();
  if (free <= 0){
    h += '<div style="margin-top:12px;background:#f9ece4;border:1px solid #e8cdbf;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#9a5f45;line-height:1.65">' +
      '<b>住不下了。</b>再来的人只能在镇口站一夜，第二天走。<br>建一处能住的地方，他们才会留下。</div>';
  } else {
    h += '<div style="margin-top:12px;font-size:12px;color:#9a8f7d">还能再住 ' + free + ' 个人。</div>';
  }

  h += '<div style="margin-top:16px"><button class="btn" data-act="night">过 夜' +
    '<span class="sub">' + (popCount() ? popCount() + ' 人吃饭，耗 ' + perDay() + ' 肉' : '镇子里还没有人') + '</span></button></div>';

    h += '<div style="text-align:center;font-size:12px;color:#a39887;margin-top:10px">今天已经过完一夜了。明天再来看看。</div>';
  }
  return h;
}

function yieldOf(t){
  let n = t.n;
  if (t.id === 'train') n += (state.build.trap || 0);
  // 作坊升级 = 同一个人干得更顺，不换人也不加时间
  if (t.id === 'quit' && state.build.forge)  n += lvAdd('forge');
  if (t.id === 'read' && state.build.market) n += lvAdd('market');
  return n;
}

function viewBuild(){
  let h = '<div class="sec-t">镇子 <span>' + popCount() + ' 人 · 上限 ' + cap() + '</span></div>';
  for (const b of BUILDS){
    const owned = state.build[b.id] || 0;

    // 盖好了、又不靠数量长的：给等级和升级入口
    if (!b.repeat && owned){
      const L = lvOf(b.id);
      const cost = L < 3 ? b.up[L] : null;
      let costTxt = '';
      if (cost) for (const k in cost){
        const ok = (state.res[k] || 0) >= cost[k];
        costTxt += '<span style="color:' + (ok ? '#8a8070' : '#c08a72') + '">' + RES[k].name + ' ' + cost[k] + '</span>';
      }
      h += '<div class="bcard up">' +
        '<div class="ic">' + buildIcon(b.icon) + '</div>' +
        '<div class="bd">' +
          '<div class="bn">' + (b.id === 'hall' ? hallName() : b.name) + '<span class="lv">Lv' + L + '</span></div>' +
          '<div class="bx">' + (cost ? '升一级 → ' + b.upText[L] : '已经到顶：' + b.upText[2]) + '</div>' +
          '<div class="bc">' + (cost ? costTxt : '<span style="color:#b8ae9c">封顶</span>') + '</div>' +
        '</div>' +
        (cost ? '<button class="bb" data-up="' + b.id + '"' + (afford(cost) ? '' : ' disabled') + '>升</button>' : '') +
      '</div>';
      continue;
    }

    if (b.cap && owned >= b.cap) continue;
    const locked = b.need && !state.build[b.need];
    const can = !locked && afford(b.cost);
    let costTxt = '';
    for (const k in b.cost){
      const ok = (state.res[k] || 0) >= b.cost[k];
      costTxt += '<span style="color:' + (ok ? '#8a8070' : '#c08a72') + '">' + RES[k].name + ' ' + b.cost[k] + '</span>';
    }
    h += '<div class="bcard">' +
      '<div class="ic">' + buildIcon(b.icon) + '</div>' +
      '<div class="bd">' +
        '<div class="bn">' + b.name + (b.repeat && owned ? '<span class="lv">×' + owned + '</span>' : '') + '</div>' +
        '<div class="bx">' + (locked ? '需要先有' + BUILD_NAME[b.need] : b.desc) + '</div>' +
        '<div class="bc">' + costTxt + ' <span style="color:#b8ae9c">· ' + b.eff + '</span></div>' +

      '<button class="bb" data-build="' + b.id + '"' + (can ? '' : ' disabled') + '>' + (locked ? '锁' : '建') + '</button>' +
    '</div>';

  h += '<div style="margin-top:14px;font-size:12px;color:#9a8f7d;line-height:1.8">' +
    '资源只有每天过夜时才结算。<br>人越多，吃得越多；人越多，能干的也越多。<br>' +
    '盖好的房子能升三级，升一级就长一样东西。</div>';
  return h;
}

/* ---------- AI 参谋（可选，默认关） ----------
   语义-数值分离：AI 只写文本、挑意图（kind），数值由白名单代码定 —— AI 碰不到数值。
   不配置 key 时整块不存在；配置存 localStorage，不进存档。 */

const AI_DEF = { ep: 'https://api.deepseek.com/chat/completions', model: 'deepseek-chat' };

function aiCfg(){
  try { return JSON.parse(localStorage.getItem('rike_ai') || 'null') || {}; } catch(e){ return {}; }
}
function aiSet(c){
  if (c && c.key) localStorage.setItem('rike_ai', JSON.stringify(c));
  else localStorage.removeItem('rike_ai');
}

// 意图 → 数值白名单。AI 只能在三种意图里挑，钱粮增减全在代码手里
const AI_KIND = {
  gain:    { fx: { good: { wood: 2, coin: 1 } } },
  cost:    { cost: { meat: 3 }, fx: { good: { safe: 1 } }, warn: '要花吃的' },
  nothing: { fx: {} }
};

function validateAIEvt(o){
  if (!o || typeof o !== 'object') return null;
  const cut = s => String(s == null ? '' : s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  const title = cut(o.title).slice(0, 14), text = cut(o.text).slice(0, 90);
  if (title.length < 2 || text.length < 8 || !Array.isArray(o.opts)) return null;
  const opts = o.opts.filter(Boolean).slice(0, 2).map(x => ({
    lb: cut(x && x.lb).slice(0, 10),
    res: cut(x && x.res).slice(0, 70),
    kind: AI_KIND[x.kind] ? x.kind : 'nothing'
  }));
  if (opts.length !== 2 || opts.some(x => x.lb.length < 2 || x.res.length < 4)) return null;
  return { title, text, cat: ['外','村','灾'].indexOf(o.cat) >= 0 ? o.cat : '外', opts };
}

function aiInject(v){
  const e = {
    id: 'ai' + state.day, cat: v.cat, w: 0.9, ai: true,
    tier: popCount() >= 6 ? 3 : popCount() >= 3 ? 2 : 1,
    title: v.title, text: v.text,
    opts: v.opts.map(x => {
      const k = AI_KIND[x.kind];
      const o = { lb: x.lb, res: x.res };
      if (k.cost) o.cost = Object.assign({}, k.cost);
      if (k.warn) o.warn = k.warn;
      if (k.fx.good) o.good = Object.assign({}, k.fx.good);
      return o;
    })
  };
  EVENTS.push(e);
  const ais = EVENTS.filter(x => x.ai);
  while (ais.length > 3) EVENTS.splice(EVENTS.indexOf(ais.shift()), 1);  // 池里最多 3 件 AI 事
  return e;
}

function aiFail(){
  const c = aiCfg(); c.lastErr = Date.now(); aiSet(c);
}

const AI_SYS =
  '你是纸上水墨风格的古镇经营游戏的事件编写者。输出 JSON（不要多余文字）：' +
  '{"title":"标题","text":"正文","cat":"外|村|灾","opts":[{"lb":"选项名","res":"结果叙述","kind":"gain|cost|nothing"},…]}。' +
  '要求：明清小镇口吻，无现代词；正文 30-70 字；恰好两个选项，是两种做法而不是对错；' +
  'res 写这段选择带来的结果，不写任何数字；kind 只能取 gain（有点进项）、cost（要花吃的）、nothing（无得失）。';

async function aiGenerate(){
  const c = aiCfg();
  if (!c.key || !state) return;
  const recent = (state.log || []).slice(-3).map(l => l.t).join('；') || '新镇，还没发生过什么。';
  const user = '镇子' + state.day + ' 天，' + popCount() + ' 人。' +
    '近期：' + recent + ' 写一件可能发生在这镇上的事。';
  try {
    const res = await fetch(c.ep || AI_DEF.ep, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model || AI_DEF.model,
        messages: [ { role: 'system', content: AI_SYS }, { role: 'user', content: user } ],
        temperature: 1.1, max_tokens: 500, response_format: { type: 'json_object' }
      })
    });
    const j = await res.json();
    const raw = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    const v = validateAIEvt(JSON.parse(raw));
    if (!v) return aiFail();
    aiInject(v);
    state.log.push({ d: state.day, t: '夜里说书人添了一段新故事：《' + v.title + '》' });
    save();
    const c2 = aiCfg(); c2.lastOk = Date.now(); delete c2.lastErr; aiSet(c2);
  } catch(e){ aiFail(); }
}

/* ---------- 交互 ---------- */

function afford(cost){
  for (const k in cost) if ((state.res[k] || 0) < cost[k]) return false;
  return true;
}
function pay(cost){
  for (const k in cost) state.res[k] = (state.res[k] || 0) - cost[k];
}
function gain(g){
  for (const k in g){
    if (k === 'safe') state.safe += g[k];
    else if (k === 'happy') state.happy += g[k];
    else state.res[k] = (state.res[k] || 0) + g[k];
  }
}

document.addEventListener('click', e => {
  const tb = e.target.closest('#tabs button');
  if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }

  const task = e.target.closest('[data-task]');
  if (task){
    const id = task.dataset.task;
    const t = TASKS.find(x => x.id === id);
    if (t.need && !state.build[t.need]){ toast('还没有' + BUILD_NAME[t.need]); return; }
    if (state.checks[id]) delete state.checks[id];
    else state.checks[id] = 1;
    save(); render();
    if (state.checks[id]) dispatchWorker(t);
    return;
  }

  const act = e.target.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'night') return doNight();
    if (a === 'export') return doExport();
    if (a === 'ai_set') return aiModal();
    if (a === 'ai_save'){
      const c = {
        ep: document.getElementById('aiEp').value.trim(),
        key: document.getElementById('aiKey').value.trim(),
        model: document.getElementById('aiModel').value.trim()
      };
      aiSet(c);
      toast(c.key ? '参谋请来了。' : '参谋送走了。');
      return aiModal();
    }
    if (a === 'ai_gen'){
      const c = {
        ep: document.getElementById('aiEp').value.trim(),
        key: document.getElementById('aiKey').value.trim(),
        model: document.getElementById('aiModel').value.trim()
      };
      if (!c.key){ toast('先填 Key。'); return; }
      aiSet(c);
      closeModal();
      toast('说书人正在打腹稿……');
      aiGenerate();
      return;
    }
    if (a === 'nextday') return closeModal();
    if (a === 'close') return closeModal();
    return;
  }

  const upg = e.target.closest('[data-up]');
  if (upg){
    const def = BUILDS.find(b => b.id === upg.dataset.up);
    if (!def) return;
    const L = lvOf(def.id);
    const cost = L < 3 && def.up ? def.up[L] : null;
    if (!cost || !afford(cost)) return;
    pay(cost);
    if (!state.lv) state.lv = {};
    state.lv[def.id] = L + 1;
    const nm = def.id === 'hall' ? hallName() : def.name + ' · Lv' + (L + 1);
    state.log.push({ d: state.day, t: nm + (def.id === 'hall' ? '挂牌了，' + def.upText[L] + '。' : ' 升到 Lv' + (L + 1) + '，' + def.upText[L] + '。') });
    save();
    toast(nm + ' — ' + def.upText[L]);
    render();
    // 升级完飘一句在房子头上：新长出来的东西是这一天的高光
    const sp = spotOf(def.icon);
    if (sp) floatText(sp.x, sp.y - 24, nm, '#5c7a4a');
    return;
  }

  const bl = e.target.closest('[data-build]');
  if (bl){
    const def = BUILDS.find(b => b.id === bl.dataset.build);
    if (!def || !afford(def.cost)) return;
    pay(def.cost);
    state.build[def.id] = (state.build[def.id] || 0) + 1;
    const before = popCount();
    state.log.push({ d: state.day, t: '盖好了' + def.name + '。' });
    save();
    const grew = popCount() - before;
    toast(def.name + ' 盖好了' + (grew > 0 ? '，搬来 ' + grew + ' 户人家' : ''));
    render();
    return;
  }

  const opt = e.target.closest('[data-opt]');
  if (opt){
    const i = parseInt(opt.dataset.opt, 10);
    applyOpt(i);
    return;
  }
});

/* ---------- 过夜 ---------- */

// 今晚来不来事，看这三样：人口、祠堂、瞭望塔。抽出来是为了能算、能测、能调
function eventRate(){
  let mult = 1;
  if (state.build.shrine) mult *= [0.60, 0.52, 0.45][lvAdd('shrine')];
  if (state.build.tower)  mult *= [0.90, 0.82, 0.75][lvAdd('tower')];
  return Math.min(0.85, 0.35 + popCount() * 0.04) * mult;
}

/* 无主之夜：断签的日子，镇子自己过。
   半速干活 × 自治系数；肉照吃；每夜事件率 ×1.3，官府摆平的小事进报表，
   摆不平的小祸丢点资源 —— 全部不弹窗，回来只看一张汇总账。
   底线：这一整段最多饿走 1 个人，不清零、不毁镇。 */
function backlogNights(n, report){
  const rate = autonomy();
  const got = {};
  let safeGain = 0;
  for (let i = 0; i < n; i++){
    for (const p of state.pop){
      const t = TASKS.find(x => x.id === p.id);
      if (!t || (t.need && !state.build[t.need])) continue;
      if (t.res === 'safe'){ safeGain += Math.round(rate); continue; }
      const v = Math.ceil(yieldOf(t) * 0.5) * rate;
      got[t.res] = (got[t.res] || 0) + v;
    }
    if (state.build.well && lvAdd('well') > 0){
      got.cloth = (got.cloth || 0) + lvAdd('well') * rate;
    }
  }
  // 汇总取整：小数不进账本
  let producedTxt = [];
  for (const k in got){
    const v = Math.round(got[k]);
    if (!v) continue;
    state.res[k] += v;
    producedTxt.push(RES[k].name + '+' + v);
  }
  if (safeGain){ state.safe += safeGain; }

  // 吃饭：每夜照吃，缺粮最多走一个人
  let gone = null, ate = 0;
  for (let i = 0; i < n; i++){
    ate += perDay();
  }
  if (ate > 0 && state.res.meat < ate){
    const lack = ate - state.res.meat;
    state.res.meat = 0;
    if (state.pop.length) gone = state.pop.pop();
    report.push({ k: '离了 ' + (n + 1) + ' 天 · 灶凉了', v: '肉 −' + ate + '（缺 ' + lack + '）' + (gone ? ' · ' + gone.who + ' 饿着走了' : ''), cls: 'neg' });
  } else if (ate > 0){
    state.res.meat -= ate;
    report.push({ k: '离了 ' + (n + 1) + ' 天', v: '挂机 ' + (producedTxt.join(' ') || '没人出工') + ' · 吃肉 −' + ate, cls: 'pos' });
  } else {
    report.push({ k: '离了 ' + (n + 1) + ' 天', v: '挂机 ' + (producedTxt.join(' ') || '没人出工'), cls: 'pos' });
  }

  // 事件：每夜掷一次，没人管事麻烦多（×1.3）。最多 1 件浮上来，其余靠官府或变成小损失
  let shown = null;
  const hl = state.build.hall ? lvOf('hall') : 0;
  for (let i = 0; i < n; i++){
    if (rnd() >= Math.min(0.95, eventRate() * 1.3)) continue;
    let evt = pickEvent();
    if (!evt) continue;
    if (hl && isMinor(evt) && evt.tier <= hl && rnd() < HALL_RATE[Math.min(hl, 3) - 1]){
      report.push({ k: hallName() + '（替班）', v: evt.title + ' · 摆平了' });
      continue;
    }
    if (!shown && state.pop.length){
      // 没人管：小事丢点资源，大事更疼（丢双倍 + 安心 −1）。不弹窗、不动人口
      const big = !isMinor(evt);
      const drain = (1 + Math.floor(rnd() * Math.min(3, 1 + popCount() / 6))) * (big ? 2 : 1);
      const pool = ['wood', 'stone', 'meat', 'coin'];
      const k = pool[Math.floor(rnd() * pool.length)];
      const real = Math.min(drain, state.res[k] || 0);
      state.res[k] -= real;
      if (big) state.safe = Math.max(0, state.safe - 1);
      report.push({ k: '没人管 · ' + evt.title, v: RES[k].name + ' −' + real + (big ? ' · 人心慌了' : ''), cls: 'neg' });
      shown = evt;
    }
  }
}

function doNight(){
  if (state.lastNight === todayStr()){
    toast('今天已经过完一夜了');
    return;
  }
  const report = [];
  let newPeople = [];

  // 0) 无主之夜：断签的日子镇子自己过（补账在最前，今天的账照旧走后面）
  const gap = state.lastNight ? daysBetween(state.lastNight, todayStr()) : 1;
  if (gap > 1) backlogNights(gap - 1, report);

  // 1) 招募
  const want = TASKS.filter(t => state.checks[t.id] && (!t.need || state.build[t.need]));
  const already = new Set(state.pop.map(p => p.id));
  for (const t of want){
    if (already.has(t.id)) continue;
    if (popCount() < cap()){
      state.pop.push({ id: t.id, who: t.who, since: state.day });
      already.add(t.id);
      newPeople.push(t.who);
      report.push({ k: t.who + ' 来了', v: t.prof, cls: 'pos' });
    } else {
      state.res.wood += 1;
      report.push({ k: t.who + ' 没地方住，走了', v: '留下 1 木', cls: 'neg' });
    }
  }

  // 2) 产出
  const produced = {};
  for (const p of state.pop){
    const t = TASKS.find(x => x.id === p.id);
    if (!t) continue;
    if (t.need && !state.build[t.need]) continue;
    if (t.res === 'safe'){ state.safe += 1; continue; }
    const n = yieldOf(t);
    produced[t.res] = (produced[t.res] || 0) + n;
  }
  // 井升级后，井边多了一个晾药布的架子：不管今天医生出不出诊，布都在那儿晾着
  if (state.build.well && lvAdd('well') > 0){
    produced.cloth = (produced.cloth || 0) + lvAdd('well');
  }
  for (const k in produced){
    state.res[k] = (state.res[k] || 0) + produced[k];
    report.push({ k: RES[k].name, v: '+' + produced[k], cls: 'pos' });
  }

  // 3) 消耗
  const eat = perDay();
  if (eat > 0){
    if (state.res.meat >= eat){
      state.res.meat -= eat;
      report.push({ k: '吃饭（' + popCount() + ' 人）', v: '−' + eat + ' 肉', cls: 'neg' });
    } else {
      const lack = eat - state.res.meat;
      state.res.meat = 0;
      report.push({ k: '肉不够', v: '−' + lack, cls: 'neg' });
      if (state.pop.length){
        const gone = state.pop.pop();
        report.push({ k: gone.who + ' 饿着走了', v: '人口 −1', cls: 'neg' });
      }
    }
  }

  // 4) 事件：先按概率掷是否出事，再抽哪件，再问官府 —— 只摆平不涉人命/走人的小事。
  //    等级越高，能管的事越大：村长家管 tier1，镇长家 tier2，城主府 tier3 也敢接
  let evt = rnd() < eventRate() ? pickEvent() : null;
  const hl = state.build.hall ? lvOf('hall') : 0;
  if (evt && hl && isMinor(evt) && evt.tier <= hl && rnd() < HALL_RATE[Math.min(hl, 3) - 1]){
    report.push({ k: hallName(), v: evt.title + ' · 摆平了' });
    evt = null;
  }

  state.checks = {};
  state.lastNight = todayStr();
  state.day += 1;
  state.came = newPeople;
  pendingGain = produced;
  save();

  if (aiCfg().key) aiGenerate();   // 过夜后请参谋打底稿，不阻塞报表

  showNightReport(report, evt);
}

// 过夜结算了但还没演给人看的那份产出
let pendingGain = null;

function rnd(){ return Math.random(); }

function showNightReport(report, evt){
  const came = state.came || [];
  let h = '<h2>第 ' + (state.day - 1) + ' 夜</h2>';
  h += '<div class="sub">' +
    (came.length ? came.join('、') + ' 到了镇上' : '没有人来') +
    ' · 现 ' + popCount() + ' 人 · ' + rank().t + '</div>';
  if (!report.length){
    h += '<p>镇子里没有人，也没有声音。这一夜很长。</p>';
  } else {
    h += '<div class="tally">';
    for (const r of report){
      h += '<div class="ti ' + (r.cls || '') + '"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></div>';
    }
    h += '</div>';
  }
  if (evt){
    state.pend = evt.id;
    save();
    h += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid #e6ddcc">' +
      '<div style="font-size:16px;font-weight:700;margin-bottom:6px">' + evt.title + '</div>' +
      '<p>' + evt.text + '</p></div>';
    h += evt.opts.map((o, i) => optHTML(o, i)).join('');
  } else {
    h += '<div style="margin-top:16px"><button class="btn" data-act="nextday">天亮了</button></div>';
  }
  openModal(h);
}

function optHTML(o, i){
  if (o.when && !o.when()) return '';   // 事件链选项：没解锁就当不存在
  const cost = o.cost || {};
  let ok = true, txt = [];
  for (const k in cost){
    const enough = (state.res[k] || 0) >= cost[k];
    if (!enough) ok = false;
    txt.push('<span style="color:' + (enough ? '#9a8f7d' : '#c08a72') + '">' + RES[k].name + ' ' + cost[k] + '</span>');
  }
  if (o.need){
    if (o.need.prof && !has(o.need.prof === 'sleep' ? 'sleep' : o.need.prof)){ ok = false; txt.push('<em>没有这个人</em>'); }
    if (o.need.build && !state.build[o.need.build]){ ok = false; txt.push('<em>需要' + BUILD_NAME[o.need.build] + '</em>'); }
    if (o.need.room && !room()){ ok = false; txt.push('<em>住不下</em>'); }
  }
  let costTxt = txt.length
    ? txt.join(' · ')
    : (o.warn ? '<em>' + o.warn + '</em>' : '<span style="color:#b0a694">不付出什么</span>');
  // 掷骰项显示白话把握，不显示数字。加成已经算进去了，玩家从「肉够不够、人在不在」自己推
  if (o.chance){
    costTxt += ' · <span style="color:#8a6f3a;font-weight:700">' + chanceWord(chanceOf(o)) + '</span>';
  }
  return '<button class="opt" data-opt="' + i + '"' + (ok ? '' : ' disabled') + '>' +
    '<span class="lb">' + o.lb + '</span><span class="cost">' + costTxt + '</span></button>';
}

function applyOpt(i){
  if (!state.pend) return;
  const evt = EVENTS.find(e => e.id === state.pend);
  if (!evt) return;
  const o = evt.opts[i];
  if (!o || (o.when && !o.when())) return;

  if (o.cost) pay(o.cost);

  // 掷骰：成了 / 平平 / 砸了。剩余概率对半分给"平平"和"砸了"。
  // 把握来自你已经投入的东西（肉、木头、该在的人）——这是攒资源的第二层意义
  let seg = null;
  if (o.chance){
    const p = chanceOf(o), r = rnd();
    if (r < p) seg = o.good;
    else if (o.flat && (r - p) < (1 - p) / 2) seg = o.flat;
    else seg = o.bad;
  }
  const eff = seg || o;
  const txt = (seg && seg.txt) || o.res;

  applyFx(eff.good, eff.bad);
  if (o.grudge){
    if (!state.grudges) state.grudges = {};
    state.grudges[o.grudge] = state.day;   // 这笔账，镇子记下了
  }

  if (!state.hist) state.hist = {};
  state.hist[evt.id] = i;   // 记仇与事件链都从这里读：你做过什么选择，镇子记得
  state.log.push({ d: state.day, t: String(txt).replace(/<[^>]+>/g, '') });
  state.pend = null;
  save();

  const segName = o.chance ? (seg === o.good ? '成了' : seg === o.flat ? '平平' : '砸了') : '结果';
  openModal('<h2>' + evt.title + '</h2><div class="sub">' + segName + '</div><p>' + txt + '</p>' +
    '<div style="margin-top:14px"><button class="btn" data-act="close">天亮了</button></div>');
  render();
}

function applyFx(good, bad){
  if (good){
    if (good.extraPop){
      const miss = TASKS.find(t => !state.pop.some(p => p.id === t.id) && (!t.need || state.build[t.need]));
      if (miss && room()){
        state.pop.push({ id: miss.id, who: '新来的', since: state.day });
      }
    } else {
      gain(good);
    }
  }
  if (bad){
    if (bad.pop){
      for (let n = 0; n < bad.pop && state.pop.length; n++) state.pop.pop();
    }
    if (bad.wood) state.res.wood = Math.max(0, state.res.wood - bad.wood);
    if (bad.meat) state.res.meat = Math.max(0, state.res.meat - bad.meat);
    if (bad.iron) state.res.iron = Math.max(0, state.res.iron - bad.iron);
    if (bad.coin) state.res.coin = Math.max(0, state.res.coin - bad.coin);
    if (bad.safe) state.safe = Math.max(0, state.safe - bad.safe);
    if (bad.loseBuild){
      const order = ['market','shrine','tower','stonehouse','forge','granary','well','hall','hut'];
      for (const k of order){ if (state.build[k] > 0){ state.build[k] -= 1; break; } }
    }
  }
}

function openModal(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  render();
  // 报表关掉之后再演收成 —— 数字刚结算完，这时候冒 +N 是真的
  if (pendingGain){
    const g = pendingGain;
    pendingGain = null;
    setTimeout(() => playHarvest(g), 380);
  }
}

let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1900);
}

function doExport(){
  const data = JSON.stringify(state, null, 2);
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data);
      toast('存档已复制到剪贴板');
    } else {
      throw new Error('no clipboard');
    }
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = data;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('存档已复制'); }
    catch(err){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
}

/* ---------- 启动 ---------- */

load();
if (state.pend){
  const evt = EVENTS.find(e => e.id === state.pend);
  if (evt){
    render();
    let h = '<h2>' + evt.title + '</h2><div class="sub">昨天夜里的事还没处理</div><p>' + evt.text + '</p>';
    h += evt.opts.map((o, i) => optHTML(o, i)).join('');
    openModal(h);
  } else { state.pend = null; save(); render(); }
} else {
  render();
}

// 人在动，镇子才是活的
startFolks();
</script>
