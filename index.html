<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="夜行">
<meta name="format-detection" content="telephone=no">
<title>夜行</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1d26'/%3E%3Ccircle cx='32' cy='26' r='9' fill='none' stroke='%23d9a441' stroke-width='3'/%3E%3Cpath d='M32 35v12M24 54h16' stroke='%23d9a441' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css">
<style>
/* ══════════════ 主题：白天纸色 / 夜里墨色 ══════════════ */
:root{
  --bg:#f4efe3; --bg2:#ece4d3; --card:#fffdf7; --card2:#f7f2e6;
  --ink:#2a2925; --ink2:#57534a; --ink3:#8b8478;
  --line:#d9cfb9; --line2:#c8ba9d;
  --acc:#a8762a; --acc2:#c99a45; --ok:#5f7a4e; --bad:#a8543c;
  --glow:rgba(201,154,69,.18);
  --chrome:rgba(244,239,227,.94);
  --r:14px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
body.night{
  --bg:#141620; --bg2:#1b1e2b; --card:#1f2330; --card2:#252a3a;
  --ink:#e6e0d2; --ink2:#b6b0a2; --ink3:#7b776d;
  --line:#2f3444; --line2:#3d4356;
  --acc:#d9a441; --acc2:#e8bd6c; --ok:#8fa87a; --bad:#c47a5e;
  --glow:rgba(217,164,65,.14);
  --chrome:rgba(20,22,32,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"LXGW WenKai Screen","Songti SC","PingFang SC",system-ui,-apple-system,"Noto Sans SC",sans-serif;
  font-size:16px; line-height:1.65;
  overflow-x:hidden; max-width:100vw;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background .7s var(--ease), color .7s var(--ease);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(66px + env(safe-area-inset-bottom))}

/* ══════════════ 顶栏 ══════════════ */
header{
  position:sticky;top:0;z-index:30;
  padding:calc(9px + env(safe-area-inset-top)) 16px 10px;
  background:var(--chrome);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  transition:background .7s var(--ease), border-color .7s var(--ease);
}
.hd-t{font-size:17px;font-weight:700;letter-spacing:.14em;line-height:1.2}
.hd-s{font-size:11.5px;color:var(--ink3);margin-top:2px;letter-spacing:.04em}
.hd-v{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.hd-v .n{font-size:21px;font-weight:700;color:var(--acc);line-height:1}
.hd-v .k{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;margin-top:3px}

/* ══════════════ 通用 ══════════════ */
.sec{padding:0 14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 9px}
.sec-h .x{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink2)}
.sec-h .y{font-size:11.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:background .5s,border-color .5s}
.note{font-size:12.5px;color:var(--ink3);line-height:1.7}

/* ══════════════ 打卡卡 ══════════════ */
.tk{
  display:flex;align-items:center;gap:11px;
  padding:12px 13px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;transition:transform .12s,border-color .25s,background .25s;
  position:relative;overflow:hidden;
}
.tk:active{transform:scale(.985)}
.tk .gl{
  width:33px;height:33px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);border-radius:10px;
  background:var(--bg2);color:var(--ink2);transition:all .3s;
}
.tk .gl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tk .bd{flex:1;min-width:0}
.tk .nm{font-size:14.5px;font-weight:600;line-height:1.35}
.tk .ds{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .eff{font-size:11px;color:var(--acc);flex-shrink:0;font-weight:600;letter-spacing:.02em}
.tk.on{background:var(--card2);border-color:var(--line2)}
.tk.on .gl{background:var(--ok);border-color:var(--ok);color:#fff}
.tk.on .ds{color:var(--ink2)}
.tk.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ══════════════ 筹码条 ══════════════ */
.chips{display:flex;gap:8px;padding:0 14px;margin:12px 0 4px}
.chip{
  flex:1;text-align:center;padding:10px 4px 9px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  transition:background .5s,border-color .5s;
}
.chip .v{font-size:19px;font-weight:700;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
.chip .k{font-size:10.5px;color:var(--ink3);margin-top:3px;letter-spacing:.06em}

/* ══════════════ 按钮 ══════════════ */
.btn{
  display:block;width:100%;padding:14px;border-radius:13px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.06em;
  cursor:pointer;transition:transform .12s,background .25s,border-color .25s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body.night .btn.primary{background:var(--acc);color:#1a1d26;border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42;cursor:default}
.btn.danger{color:var(--bad);border-color:var(--bad)}

/* ══════════════ 入夜 ══════════════ */
.nightwrap{padding:0 16px}
.scene{
  min-height:22vh;padding:22px 2px 16px;
  font-size:17px;line-height:1.95;letter-spacing:.02em;color:var(--ink);
  animation:fade .7s var(--ease);
}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scene p{margin:0 0 15px}
.scene .dim{color:var(--ink3);font-size:14px}

.opt{
  display:block;width:100%;text-align:left;
  padding:13px 14px;margin-bottom:9px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);font-family:inherit;font-size:14.5px;line-height:1.5;
  cursor:pointer;transition:transform .12s,border-color .2s,background .2s;
  position:relative;
}
.opt:active{transform:scale(.99)}
.opt .lb{display:block;font-weight:600}
.opt .cost{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.opt .cost b{color:var(--acc);font-weight:600}
.opt:disabled{opacity:.38}

/* 顶部状态条 */
.bar{
  display:flex;gap:6px;padding:9px 16px;
  border-bottom:1px solid var(--line);
  background:var(--chrome);
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.bar i{
  font-style:normal;font-size:11.5px;color:var(--ink2);
  padding:3px 9px;border-radius:20px;background:var(--bg2);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.bar i b{color:var(--acc);font-weight:700}

/* ══════════════ 城市地图 ══════════════ */
.mapwrap{padding:6px 14px 0}
.citygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px}
.blk{
  position:relative;padding:13px 12px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);
  transition:all .35s;overflow:hidden;
}
.blk.unk{opacity:.4;border-style:dashed}
.blk .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.blk .mt{font-size:10.5px;color:var(--ink3);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}
.blk .mt span{font-variant-numeric:tabular-nums}
.blk .dots{display:flex;gap:3px;margin-top:8px}
.blk .dot{width:100%;height:4px;border-radius:2px;background:var(--line)}
.blk .dot.f{background:var(--acc)}
.blk .dot.h{background:var(--acc2);opacity:.55}
.blk.lit3{box-shadow:0 0 0 1px var(--acc2), 0 0 18px -4px var(--glow)}

/* ══════════════ 弹层 ══════════════ */
#sheet{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:flex-end;justify-content:center;
  background:rgba(20,18,16,.45);
  backdrop-filter:blur(2px);
}
#sheet.on{display:flex}
#sheet-in{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .34s var(--ease);
  border-top:1px solid var(--line2);
}
@keyframes up{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
#sheet h3{margin:0 0 10px;font-size:17px;font-weight:700;letter-spacing:.06em}
#sheet .body{font-size:14.5px;line-height:1.8;color:var(--ink2);margin-bottom:16px}
#sheet .body b{color:var(--acc)}

/* ══════════════ 底部导航 ══════════════ */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;
  background:var(--chrome);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .7s,border-color .7s;
}
#tabs button{
  flex:1;border:0;background:none;padding:9px 2px 8px;
  font-family:inherit;font-size:10.5px;letter-spacing:.1em;
  color:var(--ink3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .2s;
}
#tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--acc);font-weight:700}

/* ══════════════ 建造 ══════════════ */
.bd-row{
  display:flex;align-items:center;gap:12px;
  padding:13px;margin-bottom:9px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
}
.bd-row .ic{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);border-radius:9px;color:var(--acc)}
.bd-row .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bd-row .bd{flex:1;min-width:0}
.bd-row .nm{font-size:14px;font-weight:600}
.bd-row .ds{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.bd-row .lv{display:flex;gap:3px;margin-top:6px}
.bd-row .lv i{width:14px;height:3px;border-radius:2px;background:var(--line)}
.bd-row .lv i.f{background:var(--acc)}
.bd-row button{
  flex-shrink:0;padding:7px 11px;border-radius:9px;border:1px solid var(--line2);
  background:transparent;color:var(--ink);font-family:inherit;font-size:12px;
  cursor:pointer;transition:all .2s;
}
.bd-row button:disabled{opacity:.35}
.bd-row button.can{border-color:var(--acc);color:var(--acc)}

/* ══════════════ toast ══════════════ */
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);z-index:90;
  background:var(--ink);color:var(--bg);
  padding:9px 17px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .28s var(--ease);
  max-width:82vw;text-align:center;line-height:1.45;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

.mat-inv{display:flex;gap:8px;padding:0 14px;margin:10px 0 2px;flex-wrap:wrap}
.mat-inv div{
  flex:1;min-width:66px;text-align:center;padding:9px 3px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
}
.mat-inv .v{font-size:16px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.mat-inv .k{font-size:10.5px;color:var(--ink3);margin-top:2px;letter-spacing:.06em}

.notes-item{
  font-size:13px;line-height:1.75;color:var(--ink2);
  padding:11px 13px;margin-bottom:8px;border-left:2px solid var(--line2);
  background:var(--card);border-radius:0 10px 10px 0;
}
.notes-item .who{font-size:11px;color:var(--ink3);letter-spacing:.06em;margin-bottom:3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="hd-t" id="hd-t">夜行</div>
      <div class="hd-s" id="hd-s">天亮着</div>
    </div>
    <div class="hd-v">
      <div class="n" id="hd-n">2</div>
      <div class="k" id="hd-k">滴灯油</div>
    </div>
  </header>

  <main id="main"></main>
</div>

<nav id="tabs">
  <button data-tab="day" class="on">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <span>白天</span>
  </button>
  <button data-tab="city">
    <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l5-3 5 3v13M15 21V12l4-2v11"/><path d="M8 12h1M8 16h1M12 12h1M12 16h1"/></svg>
    <span>城市</span>
  </button>
  <button data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21v-7h6v7"/></svg>
    <span>安全屋</span>
  </button>
  <button data-tab="notes">
    <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg>
    <span>笔记</span>
  </button>
</nav>

<div id="sheet"><div id="sheet-in"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   夜行 v3 —— 设计文档见 docs/GDD-v3.md
   核心：打卡 → 今晚的灯油/胆/线索 → 入夜 → 节点选择 → 带回材料 → 建造
   ═══════════════════════════════════════════════════════════ */

const SAVE = 'rike_night_v3';
const APP_VER = 'v3.0';

/* ───────── 七件事 → 筹码 ───────── */
const TASKS = [
  { id:'wake',   name:'早起',   desc:'不是被闹钟叫醒', eff:'灯油 +1', icon:'sun' },
  { id:'train',  name:'锻炼',   desc:'动到出汗',       eff:'胆 +2',   icon:'run' },
  { id:'shower', name:'洗澡',   desc:'洗干净',         eff:'隐蔽 +1',  icon:'drop' },
  { id:'study',  name:'学习',   desc:'啃一点难的东西', eff:'线索 +1', icon:'book' },
  { id:'quit',   name:'戒断',   desc:'今天没碰',       eff:'胆 +1',   icon:'ban' },
  { id:'read',   name:'阅读',   desc:'读进去',         eff:'线索 +2', icon:'read' },
  { id:'sleep',  name:'早睡',   desc:'今晚少走一步',   eff:'明天 +2', icon:'moon' }
];
const ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  run:'<circle cx="15" cy="4.5" r="1.8"/><path d="M13.5 8l-3 3 2 3-3.5 5M13.5 8l3 2 2.5-.5M12.5 14h4"/>',
  drop:'<path d="M12 3s5 5.2 5 9a5 5 0 01-10 0c0-3.8 5-9 5-9z"/>',
  book:'<path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2z"/><path d="M4 17h14"/>',
  ban:'<circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/>',
  read:'<path d="M3 6h7v14H3zM14 6h7v14h-7z"/><path d="M6 10h1M17 10h1"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  lamp:'<path d="M9 3h6l2 6H7zM12 9v9M9 21h6"/>',
  map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  shelf:'<path d="M4 4h16v16H4z"/><path d="M4 10h16M4 15h16M9 4v6M15 10v5"/>',
  sand:'<path d="M5 20V9l7-5 7 5v11z"/><path d="M9 20v-6h6v6"/>',
  gram:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>'
};

/* ───────── 城市：12 个街区 ───────── */
/* unlock: 需要已点亮的前置街区 id；dist: 从家出发的步数成本 */
const BLOCKS = [
  { id:'home',  name:'你家楼下',   dist:0, res:'wood',  danger:0, unlock:null,     desc:'一盏坏掉的声控灯。' },
  { id:'shop',  name:'便利店',     dist:1, res:'paper', danger:0, unlock:'home',   desc:'卷帘门半拉着，里面还有冷气。' },
  { id:'b3',    name:'三号楼',     dist:1, res:'cloth', danger:1, unlock:'home',   desc:'灯总是亮着，但没人承认住这。' },
  { id:'shed',  name:'旧车棚',     dist:1, res:'metal', danger:1, unlock:'home',   desc:'铁皮上全是锈，风一大就响。' },
  { id:'cross', name:'十字路口',   dist:1, res:'paper', danger:1, unlock:'shop',   desc:'四个方向都通向更暗的地方。' },
  { id:'under', name:'桥洞',       dist:2, res:'cloth', danger:2, unlock:'b3',     desc:'水声比车声大。有人在这住过。' },
  { id:'yard',  name:'废品站',     dist:2, res:'metal', danger:1, unlock:'shed',   desc:'东西堆得比人高，标价牌还在。' },
  { id:'post',  name:'老邮局',     dist:2, res:'paper', danger:1, unlock:'cross',  desc:'信箱都是开的，里面塞满了。' },
  { id:'bank',  name:'河堤',       dist:2, res:'wood',  danger:2, unlock:'under',  desc:'护栏断了一截，往下是黑的。' },
  { id:'sub',   name:'地铁口',     dist:3, res:'metal', danger:2, unlock:'post',   desc:'扶梯还在转，但没有人上去。' },
  { id:'shell', name:'烂尾楼',     dist:3, res:'cloth', danger:3, unlock:'bank',   desc:'二十三层的骨架，电梯井没有门。' },
  { id:'edge',  name:'城市边缘',   dist:3, res:'metal', danger:3, unlock:'shell',  desc:'再往前，路灯就不管了。' }
];
const MATS = {
  wood:  { name:'木', icon:'▤' },
  cloth: { name:'布', icon:'▧' },
  paper: { name:'纸', icon:'▨' },
  metal: { name:'铁', icon:'▩' }
};

/* ───────── 建筑 ───────── */
const BUILDS = [
  { id:'shelf', name:'书架',   icon:'shelf', costs:[3,8,20],  costMat:'wood',
    desc:['每晚开局线索 +1','每晚开局线索 +2','每晚开局线索 +3'] },

/* ══════════════ 状态 ══════════════ */
function blankState(){
  const city = {};
  BLOCKS.forEach(b => { city[b.id] = { lit:0, visits:0, drained:0, note:0 }; });
  city.home.lit = 1;
  return {
    v: 3, ver: APP_VER,
    date: todayKey(),
    checks: {},           // 今日打卡
    sleptLast: false,     // 昨天是否早睡 → 今天 +2 油
    mats: { wood:0, cloth:0, paper:0, metal:0 },
    build: { shelf:0, sand:0, wall:0, gram:0 },
    city: city,
    night: null,
    clueBank: 0,
    walker: { gen:1, injuries:0, name:'你' },
    notes: [],
    stats: { nights:0, deaths:0, maxDepth:0, totalSteps:0 },
    history: [],          // 每晚 {block, steps, end}
    firstRun: true
  };
}
let state = null;

/* 日期（本地时区，不用 toISOString，避免 UTC 偏移） */
function todayKey(d){
  const t = d || new Date();
  const m = String(t.getMonth()+1).padStart(2,'0');
  const day = String(t.getDate()).padStart(2,'0');
  return t.getFullYear() + '-' + m + '-' + day;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVE); }catch(e){}
  if (raw){
    try{
      const s = JSON.parse(raw);
      if (s && s.v === 3){ state = s; }
    }catch(e){}
  }
  if (!state){
    state = blankState();
    // 把 v2 院子的记录变成一段"前人笔记"
    const legacy = readLegacy();
    if (legacy) state.notes.push({
      who: '另一个人', gen: 0,
      text: '前一个人在墙上留下过记录：他做过 ' + legacy + ' 件事，但没有一件做完。'
    });
    save();
  }
  rollDay();
}
function readLegacy(){
  try{
    const raw = localStorage.getItem('rike_yard_v2');
    if (!raw) return 0;
    const o = JSON.parse(raw);
    const n = Object.values(o.yard || {}).reduce((a,b) => a + (b||0), 0);
    return n > 0 ? n : 0;
  }catch(e){ return 0; }
}
function save(){
  try{ localStorage.setItem(SAVE, JSON.stringify(state)); }catch(e){}
}

/* 跨日：重置打卡、结算早睡奖励、街区恢复 */
function rollDay(){
  const k = todayKey();
  if (state.date === k) return;
  state.date = k;
  state.checks = {};
  state.night = null;
  // 街区枯竭自然恢复
  Object.keys(state.city).forEach(id => {
    const b = state.city[id];
    if (b.drained > 0) b.drained -= 1;
  });
  state.sleptLast = !!state._sleptToday;
  state._sleptToday = false;
  state.nightDay = null;
  state.nightsToday = 0;
  save();
}

/* ══════════════ 筹码计算 ══════════════ */
function chips(){
  const c = state.checks;
  const n = TASKS.filter(t => c[t.id]).length;
  const shelfLv = state.build.shelf;
  // 同一天重复入夜：体力透支，第二次起每晚扣 2 滴，最低 1 滴
  const times = (state.nightDay === state.date) ? (state.nightsToday || 0) : 0;
  const base = 2 + n + (c.wake ? 1 : 0) - (c.sleep ? 1 : 0) + (state.sleptLast ? 2 : 0);
  return {
    count: n,
    oil: Math.max(1, base - times * 2),
    nerve: (c.train ? 2 : 0) + (c.quit ? 1 : 0),
    clue: (c.study ? 1 : 0) + (c.read ? 2 : 0) + shelfLv + (state.clueBank || 0),
    stealth: c.shower ? 1 : 0
  };
}

/* ══════════════ 城市逻辑 ══════════════ */
function blockState(id){ return state.city[id]; }
function isUnlocked(b){
  if (!b.unlock) return true;
  return blockState(b.unlock).lit >= 1;
}
function unlockedList(){ return BLOCKS.filter(isUnlocked); }

/* 产出：越走越穷 */
function yieldOf(bid){
  const b = state.city[bid];
  const def = BLOCKS.find(x => x.id === bid);
  const base = 3 + def.dist;
  const v = Math.max(1, Math.round(base * (1 - b.drained * 0.15)));
  return { mat: def.res, n: v };
}
/* 危险度：越走越安全，但暗处更险 */
function dangerOf(bid){
  const b = state.city[bid];
  const def = BLOCKS.find(x => x.id === bid);
  return Math.max(0, def.danger + (1 - b.lit/3) * 2 - b.drained * 0.2);
}

/* ══════════════ 入夜 ══════════════ */
function startNight(startId){
  const c = chips();
  // 记一次「今晚的次数」，同一天再来一次就要透支
  if (state.nightDay !== state.date){ state.nightDay = state.date; state.nightsToday = 0; }
  state.nightsToday = (state.nightsToday || 0) + 1;
  const b = state.city[startId];
  state.night = {
    start: startId, cur: startId, steps: 0,
    oil: c.oil, oilMax: c.oil,
    nerve: c.nerve, clue: c.clue, stealth: c.stealth,
    carried: { wood:0, cloth:0, paper:0, metal:0 },
    node: null, lastBlock: startId, ended: false
  };
  b.visits += 1;
  nextNode();
  save();
  render();
}

/* 抽节点 */
function pickNode(){
  const n = state.night;
  const bid = n.cur;
  const b = state.city[bid];
  const def = BLOCKS.find(x => x.id === bid);

  // 模仿机制：同街区到访 6 次 → 镜中人；3 次 → 痕迹
  if (b.visits >= 6 && !b.mirrorShown){
    b.mirrorShown = true;
    return MIRROR_NODE;
  }
  if (b.visits >= 3 && !b.traceShown){
    b.traceShown = true;
    return TRACE_NODE;
  }
  // 诱惑节点：低概率
  if (Math.random() < 0.12) return TEMPT_NODE;

  const pool = NODES[bid] || NODES.home;
  return pool[Math.floor(Math.random() * pool.length)];
}

function nextNode(){
  const n = state.night;
  if (n.oil <= 0){ endNight('oil'); return; }
  n.node = pickNode();
}

/* 邻接表：能走到哪 */
const ADJ = {
  home:['shop','b3','shed'], shop:['cross'], b3:['under'], shed:['yard'],
  cross:['post'], under:['bank'], yard:[], post:['sub'], bank:['shell'],
  shell:['edge'], sub:[], edge:[]
};
function neighbors(id){
  const out = new Set(ADJ[id] || []);
  Object.keys(ADJ).forEach(k => { if (ADJ[k].includes(id)) out.add(k); });
  return [...out].filter(x => isUnlocked(BLOCKS.find(b => b.id === x)));
}

/* ══════════════ 选项执行 ══════════════ */
function canAfford(o){
  const n = state.night;
  const c = o.cost || {};
  if ((c.oil||0) > n.oil) return false;
  if ((c.nerve||0) > n.nerve) return false;
  if ((c.clue||0) > n.clue) return false;
  return true;
}

function chooseOpt(idx){
  const n = state.night;
  if (!n || n.ended) return;
  const node = n.node;
  const o = node.o[idx];
  if (!o || !canAfford(o)){ toast('这东西你还拿不动'); return; }

  const c = o.cost || {};
  n.oil   -= (c.oil || 0);
  n.nerve -= (c.nerve || 0);
  n.clue  -= (c.clue || 0);
  n.steps += 1;

  // 材料入袋
  const g = o.gain || {};
  let got = 0;
  Object.keys(g).forEach(k => { n.carried[k] = (n.carried[k]||0) + g[k]; got += g[k]; });

  // 街区状态：到访 +1、枯竭 +1（若拿到东西）、亮度按选项
  const b = state.city[n.cur];
  const def = BLOCKS.find(x => x.id === n.cur);
  if (got > 0){
    b.drained = Math.min(5, b.drained + 1);
    if (o.lit) b.lit = Math.min(3, b.lit + o.lit);
    else b.lit = Math.min(3, b.lit + 0.5);
  }
  // 诱惑节点：这个街区"记住"你
  if (o.mark){
    b.drained = Math.min(5, b.drained + 1);
    b.watched = (b.watched||0) + 1;
  }

  state.stats.totalSteps = (state.stats.totalSteps||0) + 1;
  state.stats.maxDepth = Math.max(state.stats.maxDepth||0, n.steps);

  // 结算文本
  showResult(o.res, got ? gainText(g) : '');
  save();
  renderBar();
}

function gainText(g){
  return Object.keys(g).filter(k => g[k] > 0)
    .map(k => MATS[k].name + ' +' + g[k]).join(' · ');
}

/* 结果页 */
function showResult(text, gains){
  openSheet(
    '<h3>你做了什么</h3>' +
    '<div class="body">' + text + '</div>' +
    (gains ? '<div class="body" style="color:var(--acc);font-weight:600">' + gains + '</div>' : '') +
    '<button class="btn primary" data-act="after-node">继续</button>'
  );
}

function afterNode(){
  const n = state.night;
  closeSheet();
  if (n.oil <= 0){ endNight('oil'); return; }
  // 每 2 步给一次「换地方」的机会
  if (n.steps > 0 && n.steps % 2 === 0){
    n.pendingMove = true;
    render();
    return;
  }
  nextNode();
  render();
}

/* 移动 */
function moveTo(bid){
  const n = state.night;
  if (n.oil < 1){ toast('油不够走过去'); return; }
  n.oil -= 1;
  n.cur = bid;
  n.steps += 1;
  n.pendingMove = false;
  state.city[bid].visits += 1;
  nextNode();
  save();
  render();
}

/* ══════════════ 结束一夜 ══════════════ */
function endNight(reason){
  const n = state.night;
  if (!n || n.ended) return;
  n.ended = true;

  let keepRate = 1;
  let why = '';
  if (reason === 'home'){
    why = '你自己决定回来了。灯还够，路还在那儿。';
  } else if (reason === 'oil'){
    const sand = state.build.sand;
    keepRate = [0.5, 0.7, 0.85, 1][sand] || 0.5;
    why = keepRate >= 1
      ? '灯油烧干了。但沙袋挡着，东西一样没少。'
      : '灯油烧干了。你摸黑走回来，掉了一些东西。';
  } else if (reason === 'hurt'){
    keepRate = 0.5;
    why = '你身上不够硬，硬闯的时候受了伤。回来的路上掉了东西。';
  }

  // 材料入库
  const added = {};
  Object.keys(n.carried).forEach(k => {
    const v = Math.floor((n.carried[k]||0) * keepRate);
    if (v > 0){ state.mats[k] = (state.mats[k]||0) + v; added[k] = v; }
  });

  // 线索银行：本夜没花完的线索留一半
  state.clueBank = Math.floor(n.clue / 2);

  state.stats.nights += 1;
  state.history.push({ date: state.date, block: n.start, steps: n.steps, end: reason });
  if (state.history.length > 60) state.history.shift();

  if (reason === 'hurt'){
    state.walker.injuries += 1;
    if (state.walker.injuries >= 3) return die();
  }

  state.night = null;
  save();
  rollDay();
  render();

  const g = Object.keys(added).map(k => MATS[k].name + ' +' + added[k]).join('  ');
  openSheet(
    '<h3>回来了</h3>' +
    '<div class="body">' + why + '</div>' +
    (g ? '<div class="body" style="color:var(--acc);font-weight:600">带回：' + g + '</div>'
       : '<div class="body" style="color:var(--ink3)">什么都没带回来。</div>') +
    '<div class="body" style="color:var(--ink3);font-size:13px">今晚走了 ' + n.steps + ' 步。</div>' +
    '<button class="btn primary" data-act="close-sheet">好</button>'
  );
}

/* 死亡：不清零，留给下一代 */
function die(){
  const n = state.night;
  const lastBlock = BLOCKS.find(b => b.id === n.cur);
  const mostVisited = Object.keys(state.city)
    .sort((a,b) => state.city[b].visits - state.city[a].visits)[0];
  const mostName = BLOCKS.find(b => b.id === mostVisited).name;

  state.notes.push({
    who: '第 ' + state.walker.gen + ' 个人',
    gen: state.walker.gen,
    text: '他最后在' + lastBlock.name + '。他最常走的是' + mostName +
          '，一共 ' + state.city[mostVisited].visits + ' 次。笔记到这里就断了。'
  });

  state.stats.deaths += 1;
  state.walker.gen += 1;
  state.walker.injuries = 0;
  state.night = null;
  // 城市、建造、材料全部保留
  state.clueBank = 1 + state.build.gram;
  save();
  rollDay();
  render();

  openSheet(
    '<h3>这一代结束了</h3>' +
    '<div class="body">你在' + lastBlock.name + '没能回来。<br><br>' +
    '但城市还在。你点亮的 ' +
    Object.keys(state.city).filter(id => state.city[id].lit >= 3).length +
    ' 个街区没有灭。安全屋里的东西也还在。<br><br>' +
    '下一个人会捡到你的笔记。</div>' +
    '<button class="btn primary" data-act="close-sheet">继续</button>'
  );
}

/* ══════════════ 建造 ══════════════ */
function buildCost(def){
  const lv = state.build[def.id];
  if (lv >= 3) return null;
  return { mat: def.costMat, n: def.costs[lv] };
}
function doBuild(id){
  const def = BUILDS.find(b => b.id === id);
  const cost = buildCost(def);
  if (!cost) return;
  if ((state.mats[cost.mat]||0) < cost.n){ toast(MATS[cost.mat].name + '不够，还差 ' + (cost.n - (state.mats[cost.mat]||0))); return; }
  state.mats[cost.mat] -= cost.n;
  state.build[id] += 1;
  save();
  render();
  toast(def.name + ' 升到 ' + state.build[id] + ' 级');
}

/* ══════════════ 渲染 ══════════════ */
let tab = 'day';

function renderBar(){
  const n = state.night;
  const c = chips();
  document.getElementById('hd-t').textContent = n ? '夜里' : '夜行';
  document.getElementById('hd-s').textContent = n ? '路还长' : '天亮着';
  document.getElementById('hd-n').textContent = n ? n.oil : c.oil;
  document.getElementById('hd-k').textContent = n ? '滴油（剩）' : '滴灯油';
}

function render(){
  const n = state.night;
  document.body.classList.toggle('night', !!n);
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', !n && b.dataset.tab === tab);
  });
  renderBar();
  const main = document.getElementById('main');
  if (n) main.innerHTML = viewNight();
  else if (tab === 'day') main.innerHTML = viewDay();
  else if (tab === 'city') main.innerHTML = viewCity();
  else if (tab === 'home') main.innerHTML = viewHome();
  else main.innerHTML = viewNotes();
}

/* ───── 白天 ───── */
function viewDay(){
  const c = chips();
  let h = '<div class="sec">';
  h += '<div class="sec-h"><span class="x">今天做了什么</span><span class="y">' + c.count + ' / 7</span></div>';
  h += TASKS.map(t => {
    const on = !!state.checks[t.id];
    return '<div class="tk' + (on ? ' on' : '') + '" data-task="' + t.id + '">' +
      '<div class="gl"><svg viewBox="0 0 24 24">' + ICONS[t.icon] + '</svg></div>' +
      '<div class="bd"><div class="nm">' + t.name + '</div><div class="ds">' + t.desc + '</div></div>' +
      '<div class="eff">' + (on ? '✓' : t.eff) + '</div></div>';
  }).join('');
  h += '</div>';

  h += '<div class="chips">' +
    '<div class="chip"><div class="v">' + c.oil + '</div><div class="k">灯油</div></div>' +
    '<div class="chip"><div class="v">' + c.nerve + '</div><div class="k">胆</div></div>' +
    '<div class="chip"><div class="v">' + c.clue + '</div><div class="k">线索</div></div>' +
    '<div class="chip"><div class="v">' + c.stealth + '</div><div class="k">隐蔽</div></div>' +
    '</div>';

  h += '<div class="sec"><div class="note" style="margin:10px 2px 14px">' +
    (c.count === 0
      ? '什么都没做也能出门。两滴油，够走到楼下看一眼。'
      : (c.count >= 6 ? '今天的油很足，能走得很远。' : '做几件，就能走几步。')) +
    (state.sleptLast ? '<br>昨晚早睡，今天多了两滴。' : '') +
    (c.clue > 0 ? '<br>线索 ' + c.clue + ' 点：入夜后能看穿一些东西。' : '') +
    '</div>';
  h += '<button class="btn primary" data-act="go-night">入夜</button></div>';

  return h;
}

/* ───── 入夜 ───── */
function viewNight(){
  const n = state.night;
  let h = '<div class="bar">' +
    '<i>油 <b>' + n.oil + '</b></i>' +
    '<i>胆 <b>' + n.nerve + '</b></i>' +
    '<i>线索 <b>' + n.clue + '</b></i>' +
    (n.stealth ? '<i>隐蔽 <b>' + n.stealth + '</b></i>' : '') +
    '</div>';

  const def = BLOCKS.find(b => b.id === n.cur);

  if (n.pendingMove){
    const nb = neighbors(n.cur);
    h += '<div class="nightwrap"><div class="scene">' +
      '<p>' + def.name + '。' + def.desc + '</p>' +
      '<p class="dim">你可以换个地方，也可以回去。</p></div>';
    nb.forEach(id => {
      const bd = BLOCKS.find(x => x.id === id);
      const st = state.city[id];
      h += '<button class="opt" data-move="' + id + '">' +
        '<span class="lb">去' + bd.name + '</span>' +
        '<span class="cost">耗 <b>1</b> 滴油 · 已经走过 ' + st.visits + ' 次 · ' +
        (st.drained >= 3 ? '基本被捡空了' : '还有点东西') + '</span></button>';
    });
    h += '<button class="opt" data-act="end-home"><span class="lb">回家</span>' +
      '<span class="cost">结束今晚，带走全部</span></button>';
    h += '</div>';
    return h;
  }

  const node = n.node || { t:'', o:[] };
  h += '<div class="nightwrap"><div class="scene">' +
    '<p class="dim" style="font-size:12.5px;margin-bottom:12px">' + def.name + ' · 第 ' + (n.steps+1) + ' 步</p>' +
    '<p>' + node.t + '</p></div>';

  node.o.forEach((o, i) => {
    const ok = canAfford(o);
    const cst = [];
    if (o.cost && o.cost.oil) cst.push('油 −' + o.cost.oil);
    if (o.cost && o.cost.nerve) cst.push('胆 −' + o.cost.nerve);
    if (o.cost && o.cost.clue) cst.push('线索 −' + o.cost.clue);
    if (!cst.length) cst.push('不耗');
    const gain = o.gain ? Object.keys(o.gain).map(k => MATS[k].name + '+' + o.gain[k]).join(' ') : '';
    h += '<button class="opt' + (ok ? '' : ' locked') + '" data-opt="' + i + '"' + (ok ? '' : ' disabled') + '>' +
      '<span class="lb">' + o.lb + '</span>' +
      '<span class="cost">' + cst.join(' · ') + (gain ? ' · <b>' + gain + '</b>' : '') +
      (ok ? '' : ' · <b>不够</b>') + '</span></button>';
  });

  h += '<button class="opt" data-act="end-home" style="border-style:dashed">' +
    '<span class="lb">回家</span><span class="cost">结束今晚，带走全部</span></button>';
  h += '</div>';
  return h;
}

/* ───── 城市 ───── */
function viewCity(){
  const litCnt = Object.keys(state.city).filter(id => state.city[id].lit >= 3).length;
  let h = '<div class="mapwrap">';
  h += '<div class="sec-h"><span class="x">这座城</span><span class="y">已点亮 ' + litCnt + ' / 12</span></div>';
  h += '<div class="citygrid">';
  BLOCKS.forEach(b => {
    const st = state.city[b.id];
    const un = isUnlocked(b);
    if (!un){
      h += '<div class="blk unk"><div class="nm">？？？</div><div class="mt"><span>还没走到过</span></div></div>';
      return;
    }
    const dots = [0,1,2].map(i => '<div class="dot' + (st.lit > i ? ' f' : '') + '"></div>').join('');
    const drained = st.drained >= 4 ? '空' : (st.drained >= 2 ? '少了' : '还有');
    h += '<div class="blk' + (st.lit>=3?' lit3':'') + '">' +
      '<div class="nm">' + b.name + '</div>' +
      '<div class="mt"><span>走过 ' + st.visits + '</span><span>' + drained + '</span></div>' +
      '<div class="dots">' + dots + '</div></div>';
  });
  h += '</div>';
  h += '<div class="note" style="margin:14px 2px 20px">' +
    '走过的路会变穷，也会变安全。<br>同一个地方走太多次，它会开始记住你。</div>';
  h += '</div>';
  return h;
}

/* ───── 安全屋 ───── */
function viewHome(){
  let h = '<div class="sec"><div class="sec-h"><span class="x">材料</span><span class="y">从夜里带回来的</span></div></div>';
  h += '<div class="mat-inv">' + Object.keys(MATS).map(k =>
    '<div><div class="v">' + (state.mats[k]||0) + '</div><div class="k">' + MATS[k].name + '</div></div>'
  ).join('') + '</div>';

  h += '<div class="sec"><div class="sec-h"><span class="x">能修的东西</span><span class="y">最高 3 级</span></div>';
  h += BUILDS.map(d => {
    const lv = state.build[d.id];
    const cost = buildCost(d);
    const can = cost && (state.mats[cost.mat]||0) >= cost.n;
    const lvBar = [0,1,2].map(i => '<i class="' + (lv > i ? 'f' : '') + '"></i>').join('');
    return '<div class="bd-row">' +
      '<div class="ic"><svg viewBox="0 0 24 24">' + ICONS[d.icon] + '</svg></div>' +
      '<div class="bd"><div class="nm">' + d.name + '</div>' +
      '<div class="ds">' + (lv > 0 ? d.desc[lv-1] : '还没修') + '</div>' +
      '<div class="lv">' + lvBar + '</div></div>' +
      (cost
        ? '<button data-build="' + d.id + '" class="' + (can?'can':'') + '"' + (can?'':' disabled') + '>' +
          MATS[cost.mat].name + ' ' + cost.n + '</button>'
        : '<button disabled>满了</button>') +
      '</div>';
  }).join('');
  h += '</div>';
  return h;
}

/* ───── 笔记 ───── */
function viewNotes(){
  let h = '<div class="sec"><div class="sec-h"><span class="x">留在这里的话</span><span class="y">第 ' + state.walker.gen + ' 个人</span></div>';
  h += '<div class="note" style="margin:0 2px 14px">' +
    '做过 ' + state.stats.nights + ' 个晚上，走了 ' + (state.stats.totalSteps||0) + ' 步。' +
    (state.stats.deaths ? '<br>有 ' + state.stats.deaths + ' 个人没能回来。' : '') + '</div>';

  if (!state.notes.length){
    h += '<div class="notes-item"><div class="who">还没有</div>还没人在这里留下过话。</div>';
  } else {
    h += state.notes.slice().reverse().map(n =>
      '<div class="notes-item"><div class="who">' + n.who + '</div>' + n.text + '</div>'
    ).join('');
  }
  h += '</div>';

  h += '<div class="sec" style="margin-top:20px">' +
    '<button class="btn ghost" data-act="export" style="margin-bottom:9px">导出数据</button>' +
    '<button class="btn ghost" data-act="import" style="margin-bottom:9px">导入数据</button>' +
    '<button class="btn ghost danger" data-act="reset">清空全部</button>' +
    '<div style="text-align:center;font-size:11.5px;color:var(--ink3);padding:14px 0 8px">夜行 ' + APP_VER + '</div>' +
    '</div>';
  return h;
}

/* ══════════════ 弹层 ══════════════ */
function openSheet(html){
  document.getElementById('sheet-in').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
}
let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ══════════════ 选择出发地 ══════════════ */
function chooseStart(){
  const list = unlockedList();
  let h = '<h3>今晚去哪</h3><div class="body">灯油 ' + chips().oil + ' 滴。每走一步烧一滴。</div>';
  list.forEach(b => {
    const st = state.city[b.id];
    h += '<button class="opt" data-start="' + b.id + '">' +
      '<span class="lb">' + b.name + '</span>' +
      '<span class="cost">' + b.desc + ' · 去过 ' + st.visits + ' 次</span></button>';
  });
  openSheet(h);
}

/* ══════════════ 事件 ══════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-task],[data-opt],[data-move],[data-start],[data-build],[data-act],[data-tab]');
  if (!t) return;

  if (t.dataset.tab){
    if (state.night){ toast('天还没亮'); return; }
    tab = t.dataset.tab;
    render();
    return;
  }
  if (t.dataset.task){
    const id = t.dataset.task;
    if (state.checks[id]){
      delete state.checks[id];
      if (id === 'sleep') state._sleptToday = false;
    } else {
      state.checks[id] = true;
      if (id === 'sleep') state._sleptToday = true;
      t.classList.add('pop');
    }
    save();
    render();
    return;
  }
  if (t.dataset.start !== undefined && t.dataset.start){
    closeSheet();
    startNight(t.dataset.start);
    return;
  }
  if (t.dataset.opt !== undefined && t.dataset.opt !== ''){
    chooseOpt(parseInt(t.dataset.opt, 10));
    return;
  }
  if (t.dataset.move){
    moveTo(t.dataset.move);
    return;
  }
  if (t.dataset.build){
    doBuild(t.dataset.build);
    return;
  }

  const act = t.dataset.act;
  if (act === 'go-night'){ chooseStart(); return; }
  if (act === 'end-home'){ endNight('home'); return; }
  if (act === 'after-node'){ afterNode(); return; }
  if (act === 'close-sheet'){ closeSheet(); render(); return; }
  if (act === 'export'){
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    openSheet('<h3>导出</h3><div class="body">复制下面这段，存到别处。</div>' +
      '<textarea readonly style="width:100%;height:120px;font-size:11px;border-radius:9px;border:1px solid var(--line);padding:9px;background:var(--card2);color:var(--ink)">' + data + '</textarea>' +
      '<button class="btn primary" style="margin-top:12px" data-act="close-sheet">好</button>');
    return;
  }
  if (act === 'import'){
    openSheet('<h3>导入</h3><div class="body">把之前导出的内容粘进来。</div>' +
      '<textarea id="imp" style="width:100%;height:120px;font-size:11px;border-radius:9px;border:1px solid var(--line);padding:9px;background:var(--card2);color:var(--ink)"></textarea>' +
      '<button class="btn primary" style="margin-top:12px" data-act="do-import">导入</button>');
    return;
  }
  if (act === 'do-import'){
    const v = document.getElementById('imp').value.trim();
    try{
      const o = JSON.parse(decodeURIComponent(escape(atob(v))));
      if (!o || o.v !== 3) throw 0;
      state = o; save(); closeSheet(); render(); toast('导入成功');
    }catch(err){ toast('这段数据读不出来'); }
    return;
  }
  if (act === 'reset'){
    if (confirm('清空这个游戏？城市、建造、笔记都会没了。')){
      state = blankState(); save(); closeSheet(); render(); toast('已经清空');
    }
    return;
  }
});

/* ══════════════ SW 更新 ══════════════ */
function registerSW(){
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
}

/* ══════════════ 启动 ══════════════ */
load();
render();
registerSW();

setInterval(() => {
  const k = todayKey();
  if (state.date !== k){ rollDay(); render(); }
}, 60000);
</script>
