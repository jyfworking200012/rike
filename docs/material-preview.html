<title>开源素材预览</title>
<style>
  body{margin:0;background:#efe9dc;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#2c2a25}
  .wrap{max-width:430px;margin:0 auto;padding:16px 16px 32px}
  h1{font-size:15px;font-weight:500;margin:0 0 3px}
  .sub{font-size:11.5px;color:#6b6459;margin:0 0 14px}
  .paper{background:#f7f2e6;border-radius:13px;padding:12px 10px 9px}
  .town{display:flex;align-items:flex-end;justify-content:center;gap:3px;color:#3a352c}
  .ground{height:2px;background:#c9bfa9;margin:2px 0 7px;border-radius:2px}
  .cap{font-size:10.5px;color:#7a7265;text-align:center;letter-spacing:.03em}
  .rowlbl{font-size:11px;color:#8a8171;margin:16px 0 7px;letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .cell{background:#f7f2e6;border-radius:9px;padding:7px 3px 5px;text-align:center;color:#3a352c}
  .cell svg{display:block;margin:0 auto 3px}
  .cell span{font-size:10px;color:#6b6459;display:block;line-height:1.3}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
  .cmp figure{margin:0}
  .cmp img{width:100%;border-radius:8px;display:block;border:1px solid #ddd4c2}
  .cmp figcaption{font-size:10px;color:#7a7265;margin-top:4px;text-align:center}
  .note{font-size:10.5px;color:#8a8171;margin-top:14px;line-height:1.65}
